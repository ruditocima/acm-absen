<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Enterprise - Luxury Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { gold: { 500: '#d4af37', 600: '#aa8c2c', 400: '#e6ca65' } } } } }
    </script>
    <style>
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); }
    </style>
</head>
<body class="h-full text-slate-100 font-sans flex flex-col">

    <!-- SIMULATION CONTROL BAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center z-50 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center text-slate-950 font-bold shadow-md">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-wide uppercase text-gold-400">Panel Simulasi Absensi</h1>
            </div>
        </div>
        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
            <button onclick="switchMode('mobile')" id="btn-mobile" class="px-4 py-2 text-xs font-semibold rounded-lg bg-gold-500 text-slate-950 transition-all shadow-md flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen"></i> HP
            </button>
            <button onclick="switchMode('desktop')" id="btn-desktop" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-desktop"></i> Desktop
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden relative flex justify-center items-center bg-slate-950">

        <!-- MOBILE VIEW -->
        <div id="view-mobile" class="w-full h-full max-w-md bg-slate-900 flex flex-col shadow-2xl relative overflow-hidden sm:border-x sm:border-slate-800 sm:max-h-[850px] sm:rounded-3xl">
            <!-- Mobile Content -->
            <div class="p-5 bg-gradient-to-b from-slate-800 to-slate-900 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-bold text-white">Halo, Rudi Batubara</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-5 space-y-5">
                <div id="m-tab-absen" class="space-y-5">
                    <div class="glass-card p-6 rounded-3xl text-center">
                        <h3 id="live-clock" class="text-4xl font-black text-white my-2">--:--:--</h3>
                        <p id="coord-info" class="text-xs text-gold-400 font-medium">Klik absen untuk verifikasi lokasi...</p>
                        <button onclick="handleAbsen()" class="w-full mt-6 py-4 rounded-2xl gold-gradient text-slate-950 font-bold text-sm">ABSEN MASUK</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- DESKTOP VIEW -->
        <div id="view-desktop" class="w-full h-full bg-slate-950 hidden flex overflow-hidden">
            <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
                <nav class="flex-1 p-4 space-y-1 text-xs">
                    <button onclick="switchDesktopTab('dashboard')" id="d-nav-dashboard" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-gold-500/10 text-gold-400 border border-gold-500/20">Dashboard</button>
                    <button onclick="switchDesktopTab('rekap')" id="d-nav-rekap" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400">Rekap</button>
                </nav>
            </aside>
            <div class="flex-1 p-6">
                <h3 id="desktop-title" class="text-white font-bold mb-4">Dashboard & Statistik</h3>
                <div id="d-tab-dashboard" class="space-y-4">
                    <div class="grid grid-cols-4 gap-4">
                        <div class="glass-card p-5 rounded-2xl border-l-4 border-gold-500">
                            <span class="text-slate-400">Total Karyawan</span>
                            <h4 class="text-2xl font-bold">124 Orang</h4>
                        </div>
                    </div>
                </div>
                <div id="d-tab-rekap" class="hidden">
                    <p class="text-slate-400">Halaman Rekap Absensi</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. SETTINGS & COORDINATES ---
        const BASECAMP_LAT = 0.434291;
        const BASECAMP_LNG = 101.466385;
        const MAX_RADIUS = 15000;

        // --- 2. SWITCH MODES ---
        function switchMode(mode) {
            document.getElementById('view-mobile').classList.toggle('hidden', mode !== 'mobile');
            document.getElementById('view-desktop').classList.toggle('hidden', mode !== 'desktop');
            document.getElementById('btn-mobile').className = mode === 'mobile' ? "px-4 py-2 text-xs font-semibold rounded-lg bg-gold-500 text-slate-950 shadow-md flex items-center gap-2" : "px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 flex items-center gap-2";
            document.getElementById('btn-desktop').className = mode === 'desktop' ? "px-4 py-2 text-xs font-semibold rounded-lg bg-gold-500 text-slate-950 shadow-md flex items-center gap-2" : "px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 flex items-center gap-2";
        }

        // --- 3. DESKTOP TABS ---
        function switchDesktopTab(tab) {
            ['dashboard', 'rekap'].forEach(t => {
                document.getElementById(`d-tab-${t}`).classList.add('hidden');
                document.getElementById(`d-nav-${t}`).className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800";
            });
            document.getElementById(`d-tab-${tab}`).classList.remove('hidden');
            document.getElementById(`d-nav-${tab}`).className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-gold-500/10 text-gold-400 border border-gold-500/20";
        }

        // --- 4. SECURE LOGIC ---
        async function getServerTime() {
            // Dalam produksi, ganti dengan fetch ke API server Anda
            return new Date(); 
        }

        async function handleAbsen() {
            const btn = document.querySelector('button[onclick="handleAbsen()"]');
            const originalHtml = btn.innerHTML;
            
            if (!navigator.geolocation) { alert('Browser tidak dukung lokasi'); return; }

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> MEMVERIFIKASI...`;
            btn.disabled = true;

            const serverTime = await getServerTime();

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    
                    // Validasi Akurasi (Security)
                    if (accuracy > 20) {
                        alert(`Akurasi GPS rendah (${Math.round(accuracy)}m). Sistem menolak absensi palsu.`);
                        btn.innerHTML = originalHtml; btn.disabled = false; return;
                    }

                    // Validasi Jarak
                    const R = 6371e3;
                    const dLat = (BASECAMP_LAT - latitude) * Math.PI / 180;
                    const dLon = (BASECAMP_LNG - longitude) * Math.PI / 180;
                    const a = Math.sin(dLat/2)**2 + Math.cos(latitude*Math.PI/180) * Math.cos(BASECAMP_LAT*Math.PI/180) * Math.sin(dLon/2)**2;
                    const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

                    if (distance > MAX_RADIUS) {
                        alert("Lokasi di luar radius basecamp.");
                    } else {
                        alert(`Absensi Berhasil pada ${serverTime.toLocaleTimeString()}`);
                    }
                    
                    btn.innerHTML = originalHtml; btn.disabled = false;
                },
                (err) => { alert('Gagal akses GPS'); btn.innerHTML = originalHtml; btn.disabled = false; },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // Clock
        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toTimeString().split(' ')[0]; }, 1000);
    </script>
</body>
</html>
