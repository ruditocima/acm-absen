<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi YOFC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-light { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        #basecampMap { height: 250px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="absensiApp()">

    <header class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-extrabold text-xl">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-400 bg-clip-text text-transparent">YOFC TEAM ATTENDANCE</h1>
                <p class="text-xs text-slate-400 font-medium">Secure Geofencing Portal</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button @click="switchRole()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition font-semibold text-amber-400">
                <i class="fa-solid fa-rotate mr-1"></i> Mode: <span x-text="isAdminView ? 'Admin / Staff Portal' : 'Karyawan (HP)'"></span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- BLOCKED DESKTOP VIEW -->
        <template x-if="!isAdminView && isDesktopDevice && !simulationMode">
            <div class="max-w-md mx-auto mt-16 glass-card p-8 rounded-3xl text-center shadow-2xl border border-red-500/20">
                <div class="w-20 h-20 bg-red-500/10 text-red-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Akses Dibatasi</h2>
                <p class="text-slate-400 text-sm mb-6">Sistem Absensi Karyawan hanya diizinkan melalui perangkat <strong>Smartphone (HP)</strong>.</p>
                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs p-3 rounded-xl mb-6">
                    <i class="fa-solid fa-info-circle mr-1"></i> Aktifkan <strong>Mode Simulasi</strong> untuk menguji dari laptop.
                </div>
                <button @click="simulationMode = true" class="w-full py-3 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/30">
                    AKTIFKAN MODE SIMULASI
                </button>
            </div>
        </template>

        <!-- KARYAWAN PORTAL -->
        <template x-if="!isAdminView && (!isDesktopDevice || simulationMode)">
            <div class="max-w-md mx-auto">
                <div class="bg-amber-400 text-slate-950 p-4 rounded-2xl mb-6 shadow-xl flex items-center justify-between font-bold">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-sun text-xl animate-spin"></i>
                        <span class="text-sm">MODE CERAH LUAR RUANGAN</span>
                    </div>
                    <button @click="simulationMode = !simulationMode" class="text-xs bg-slate-950 text-amber-400 px-2 py-1 rounded-md">
                        Simulasi: <span x-text="simulationMode ? 'ON' : 'OFF'"></span>
                    </button>
                </div>

                <div class="flex bg-slate-900 p-1.5 rounded-2xl mb-6 border border-slate-800">
                    <button @click="employeeTab = 'checkin'" :class="employeeTab === 'checkin' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'" class="flex-1 py-2 rounded-xl text-xs transition text-center">
                        <i class="fa-solid fa-fingerprint mr-1"></i> Check-in Absen
                    </button>
                    <button @click="employeeTab = 'pengajuan'" :class="employeeTab === 'pengajuan' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'" class="flex-1 py-2 rounded-xl text-xs transition text-center">
                        <i class="fa-solid fa-file-pen mr-1"></i> Ajukan Izin/Sakit
                    </button>
                </div>

                <template x-if="employeeTab === 'checkin'">
                    <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-black text-slate-900">Check-in Kehadiran</h2>
                            <p class="text-xs font-semibold text-slate-600 mt-1">Uji Coba: ID <strong class="text-amber-600">rudi01</strong> | Pass <strong class="text-amber-600">123456</strong></p>
                        </div>

                        <form @submit.prevent="handleCheckIn" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID Karyawan</label>
                                <input type="text" x-model="loginId" autocapitalize="none" autocorrect="off" autocomplete="off" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: rudi01">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                <input type="password" x-model="loginPass" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
                            </div>

                            <div class="bg-slate-900 text-slate-100 p-4 rounded-2xl text-xs space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Status GPS:</span>
                                    <span class="font-bold text-emerald-400" x-text="gpsStatus"></span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Basecamp Terdekat:</span>
                                    <span class="font-bold text-amber-400" x-text="detectedBasecamp ? detectedBasecamp.name : 'Mencari Lokasi...'"></span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Jarak Real-Time:</span>
                                    <span class="font-bold text-sky-400" x-text="nearestDistanceText"></span>
                                </div>
                            </div>

                            <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 hover:opacity-95 transition transform active:scale-95">
                                <i class="fa-solid fa-location-arrow mr-2"></i> CHECK-IN SEKARANG
                            </button>
                        </form>
                    </div>
                </template>

                <template x-if="employeeTab === 'pengajuan'">
                    <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white space-y-6">
                        <div class="text-center">
                            <h2 class="text-2xl font-black text-slate-900">Pengajuan Izin / Sakit</h2>
                        </div>
                        <form @submit.prevent="submitLeaveRequest" class="space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID Karyawan</label>
                                    <input type="text" x-model="leaveForm.empId" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 text-xs outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Jenis</label>
                                    <select x-model="leaveForm.type" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 text-xs outline-none">
                                        <option value="Sakit">Sakit</option>
                                        <option value="Izin">Izin</option>
                                        <option value="Cuti">Cuti</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Dari Tanggal</label>
                                    <input type="date" x-model="leaveForm.startDate" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Sampai Tanggal</label>
                                    <input type="date" x-model="leaveForm.endDate" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs outline-none">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Alasan</label>
                                <textarea x-model="leaveForm.reason" rows="3" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs outline-none" placeholder="Tuliskan alasan..."></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-sm shadow-lg">KIRIM PENGAJUAN</button>
                        </form>
                    </div>
                </template>
            </div>
        </template>

        <!-- ADMIN / STAFF PORTAL -->
        <template x-if="isAdminView">
            <div class="space-y-6">
                <!-- LOGIN ADMIN -->
                <template x-if="!isAdminLoggedIn">
                    <div class="max-w-md mx-auto mt-12">
                        <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                            <div class="text-center mb-6">
                                <div class="w-16 h-16 bg-amber-500/10 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <h2 class="text-2xl font-black text-slate-900">Login Portal Admin</h2>
                                <p class="text-xs text-slate-500 mt-1">Master User: <strong>admin</strong> | Pass: <strong>Ounyenk2018#</strong></p>
                            </div>

                            <form @submit.prevent="handleAdminLogin" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID / Username</label>
                                    <input type="text" x-model="adminLoginUser" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 outline-none" placeholder="admin atau rudi01">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                    <input type="password" x-model="adminLoginPass" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 outline-none" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-4 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-base shadow-lg">LOGIN PORTAL</button>
                            </form>
                        </div>
                    </div>
                </template>

                <!-- DASHBOARD ADMIN -->
                <template x-if="isAdminLoggedIn">
                    <div class="space-y-6">
                        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-bold text-slate-200 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800" x-text="currentUserRole"></span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button @click="adminTab = 'rekap'; loadData()" :class="adminTab === 'rekap' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'" class="px-4 py-2 rounded-xl text-xs transition">Rekap Absensi</button>
                                <button @click="adminTab = 'karyawan'; loadData()" :class="adminTab === 'karyawan' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'" class="px-4 py-2 rounded-xl text-xs transition">Karyawan</button>
                                <button @click="adminLogout()" class="px-3 py-2 bg-red-500/20 text-red-300 rounded-xl text-xs font-bold">Logout</button>
                            </div>
                        </div>

                        <!-- TAB REKAP -->
                        <div x-show="adminTab === 'rekap'" class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex justify-between items-center">
                                <h2 class="text-xl font-bold text-white">Rekapitulasi Absensi Supabase</h2>
                                <button @click="loadData()" class="px-3 py-2 bg-slate-800 text-amber-400 text-xs font-bold rounded-xl"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data</button>
                            </div>
                            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                                            <th class="p-4">Waktu</th>
                                            <th class="p-4">ID</th>
                                            <th class="p-4">Nama</th>
                                            <th class="p-4">Role</th>
                                            <th class="p-4">Basecamp</th>
                                            <th class="p-4">Akurasi GPS</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        <template x-for="item in attendanceLogs" :key="item.id">
                                            <tr class="hover:bg-slate-900/50 transition">
                                                <td class="p-4 font-semibold text-slate-300" x-text="item.timestamp"></td>
                                                <td class="p-4 font-mono text-amber-400" x-text="item.empId"></td>
                                                <td class="p-4 font-bold text-white" x-text="item.name"></td>
                                                <td class="p-4 text-slate-400" x-text="item.role"></td>
                                                <td class="p-4 text-amber-300 font-semibold" x-text="item.basecamp"></td>
                                                <td class="p-4 text-emerald-400"><span x-text="item.accuracy"></span> meter</td>
                                            </tr>
                                        </template>
                                        <template x-if="attendanceLogs.length === 0">
                                            <tr>
                                                <td colspan="6" class="p-8 text-center text-slate-500 italic">Belum ada data absensi tercatat di Supabase.</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- TAB KARYAWAN -->
                        <div x-show="adminTab === 'karyawan'" class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex justify-between items-center">
                                <h2 class="text-xl font-bold text-white">Daftar Karyawan di Supabase</h2>
                                <button @click="openEmployeeModal()" class="px-4 py-2 bg-amber-500 text-slate-950 text-xs font-extrabold rounded-xl">Tambah Karyawan</button>
                            </div>
                            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                                            <th class="p-4">ID</th>
                                            <th class="p-4">Nama</th>
                                            <th class="p-4">Role</th>
                                            <th class="p-4">Password</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        <template x-for="emp in employees" :key="emp.id">
                                            <tr class="hover:bg-slate-900/50 transition">
                                                <td class="p-4 font-mono text-amber-400" x-text="emp.id"></td>
                                                <td class="p-4 font-bold text-white" x-text="emp.name"></td>
                                                <td class="p-4 text-slate-300" x-text="emp.role"></td>
                                                <td class="p-4 font-mono text-slate-400" x-text="emp.password"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </main>

    <!-- MODAL KARYAWAN -->
    <div x-show="showEmployeeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4">
        <div class="glass-card max-w-md w-full p-6 rounded-3xl space-y-4 border border-slate-700">
            <h3 class="text-lg font-bold text-white">Tambah Karyawan Baru</h3>
            <form @submit.prevent="saveEmployee" class="space-y-3">
                <input type="text" x-model="employeeForm.id" placeholder="ID Karyawan (contoh: rudi02)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <input type="text" x-model="employeeForm.name" placeholder="Nama Lengkap" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <input type="text" x-model="employeeForm.role" placeholder="Role / Jabatan" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <input type="text" x-model="employeeForm.password" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" @click="showEmployeeModal = false" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-xl">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wtvwugzwjywnzughmcts.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0dnd1Z3p3anl3bnp1Z2htY3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzEyNjQsImV4cCI6MjEwMTUwNzI2NH0.iC2CNTEYKdVAtyvNSBAEw108SrKgNH__3zbOq0HP7jM';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getLocalDate() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function absensiApp() {
            return {
                isAdminView: false,
                isAdminLoggedIn: false,
                adminLoginUser: '',
                adminLoginPass: '',
                adminTab: 'rekap',
                simulationMode: true, // Default aktif agar mudah diuji di browser laptop
                isDesktopDevice: window.innerWidth >= 1024,
                currentUserRole: '',
                
                employeeTab: 'checkin',
                loginId: '', loginPass: '',
                gpsStatus: 'GPS Siap', gpsAccuracy: 5, currentCoords: { lat: 0.50653, lng: 101.42304 }, detectedBasecamp: { name: 'HO Pekanbaru' },
                leaveForm: { empId: '', type: 'Sakit', startDate: getLocalDate(), endDate: getLocalDate(), reason: '' },
                
                showEmployeeModal: false,
                employeeForm: { id: '', name: '', role: '', password: '' },

                basecamps: [], employees: [], attendanceLogs: [], leaves: [],

                async init() {
                    await this.loadData();
                },

                async loadData() {
                    try {
                        let { data: att, error: errAtt } = await _supabase.from('attendance').select('*').order('id', { ascending: false });
                        if (errAtt) console.error('Error load attendance:', errAtt);
                        if (att) {
                            this.attendanceLogs = att.map(i => ({ 
                                id: i.id, empId: i.emp_id, name: i.name, role: i.role, 
                                basecamp: i.basecamp, timestamp: i.timestamp, date: i.date, accuracy: i.accuracy 
                            }));
                        }

                        let { data: emp, error: errEmp } = await _supabase.from('employees').select('*');
                        if (errEmp) console.error('Error load employees:', errEmp);
                        if (emp) this.employees = emp;

                        let { data: bc } = await _supabase.from('basecamps').select('*');
                        if (bc) this.basecamps = bc;
                    } catch (e) {
                        console.error('Koneksi Supabase Gagal:', e);
                    }
                },

                switchRole() { 
                    this.isAdminView = !this.isAdminView; 
                    if (this.isAdminView) this.loadData(); 
                    else this.isAdminLoggedIn = false; 
                },

                handleAdminLogin() {
                    if (this.adminLoginUser === 'admin' && this.adminLoginPass === 'Ounyenk2018#') {
                        this.isAdminLoggedIn = true; 
                        this.currentUserRole = 'Master Admin';
                        this.adminLoginUser = ''; this.adminLoginPass = ''; 
                        this.loadData();
                    } else {
                        const emp = this.employees.find(e => e.id.toLowerCase() === this.adminLoginUser.trim().toLowerCase() && e.password === this.adminLoginPass);
                        if (emp) {
                            this.isAdminLoggedIn = true; 
                            this.currentUserRole = emp.role; 
                            this.adminLoginUser = ''; this.adminLoginPass = ''; 
                            this.loadData();
                        } else {
                            alert('Login Gagal! Periksa ID atau Password.');
                        }
                    }
                },
                adminLogout() { 
                    this.isAdminLoggedIn = false; 
                },

                async handleCheckIn() {
                    if (!this.loginId || !this.loginPass) {
                        alert('Mohon masukkan ID Karyawan dan Password!');
                        return;
                    }

                    // 1. Validasi Karyawan ke Supabase
                    const { data: empList, error: empErr } = await _supabase
                        .from('employees')
                        .select('*')
                        .ilike('id', this.loginId.trim());

                    if (empErr || !empList || empList.length === 0) {
                        alert('Check-in Gagal: ID Karyawan "' + this.loginId + '" tidak ditemukan di database Supabase!');
                        return;
                    }

                    const emp = empList[0];
                    if (emp.password !== this.loginPass) {
                        alert('Check-in Gagal: Password salah!');
                        return;
                    }

                    // 2. Simpan Data Absensi ke Supabase
                    const now = new Date();
                    const record = {
                        emp_id: emp.id,
                        name: emp.name,
                        role: emp.role || 'Installer',
                        basecamp: this.detectedBasecamp ? this.detectedBasecamp.name : 'HO Pekanbaru',
                        timestamp: now.toLocaleString('id-ID'),
                        date: getLocalDate(),
                        accuracy: this.gpsAccuracy || 5
                    };

                    const { error: insErr } = await _supabase.from('attendance').insert([record]);
                    
                    if (insErr) {
                        alert('Gagal menyimpan ke Supabase: ' + insErr.message);
                        console.error('Insert Error:', insErr);
                    } else {
                        alert('Berhasil! Check-in untuk ' + emp.name + ' telah tersimpan di Supabase.');
                        this.loginId = ''; 
                        this.loginPass = ''; 
                        await this.loadData();
                    }
                },

                async submitLeaveRequest() {
                    const emp = this.employees.find(e => e.id.toLowerCase() === this.leaveForm.empId.trim().toLowerCase());
                    if (!emp) {
                        alert('ID Karyawan tidak ditemukan!');
                        return;
                    }
                    const { error } = await _supabase.from('leaves').insert([{
                        emp_id: emp.id, name: emp.name, type: this.leaveForm.type,
                        start_date: this.leaveForm.startDate, end_date: this.leaveForm.endDate,
                        reason: this.leaveForm.reason, status: 'Pending', timestamp: new Date().toLocaleString('id-ID')
                    }]);
                    if (error) alert('Gagal: ' + error.message); 
                    else { 
                        alert('Pengajuan berhasil dikirim.'); 
                        this.loadData(); 
                    }
                },

                openEmployeeModal() { 
                    this.employeeForm = { id: '', name: '', role: '', password: '' }; 
                    this.showEmployeeModal = true; 
                },

                async saveEmployee() {
                    const { error } = await _supabase.from('employees').upsert([this.employeeForm]);
                    if (error) {
                        alert('Gagal menyimpan karyawan: ' + error.message);
                    } else {
                        alert('Karyawan berhasil disimpan ke Supabase!');
                        this.showEmployeeModal = false;
                        this.loadData();
                    }
                }
            }
        }
    </script>
</body>
</html>
