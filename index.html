<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi ACM - Enterprise Attendance System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col" x-data="attendanceApp()">

    <!-- Header / Navbar -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold tracking-wide">Absensi ACM</span>
                <span class="text-xs bg-blue-700 px-2 py-1 rounded text-blue-200">Enterprise Dashboard</span>
            </div>
            <div class="text-sm text-blue-200" x-text="currentTime"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Notifikasi Error / Sukses -->
        <template x-if="errorMessage">
            <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r shadow-sm flex justify-between items-center" role="alert">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <span class="text-sm font-medium text-red-800" x-text="errorMessage"></span>
                </div>
                <button @click="loadData()" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-semibold px-3 py-1.5 rounded transition">
                    Coba Lagi
                </button>
            </div>
        </template>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center">
                <div class="p-3 rounded-lg bg-blue-50 text-blue-600 mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Total Kehadiran</p>
                    <h3 class="text-2xl font-bold text-slate-700" x-text="attendanceList.length">0</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center">
                <div class="p-3 rounded-lg bg-emerald-50 text-emerald-600 mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Status Koneksi</p>
                    <h3 class="text-sm font-semibold mt-1" :class="isConnected ? 'text-emerald-600' : 'text-red-500'" x-text="isConnected ? 'Terhubung ke Server' : 'Terputus / Error'"></h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Penyegaran Data</p>
                    <span class="text-xs text-slate-400">Sinkronisasi Realtime</span>
                </div>
                <button @click="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-4 py-2 rounded-lg transition shadow-sm flex items-center">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Tabel Data Absensi -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-700">Log Rekapitulasi Absensi</h3>
                <span class="text-xs text-slate-400" x-text="'Menampilkan ' + attendanceList.length + ' data'"></span>
            </div>

            <div class="overflow-x-auto relative">
                <!-- Loading Overlay -->
                <div x-show="loading" class="absolute inset-0 bg-white/80 backdrop-blur-xs flex items-center justify-center z-10">
                    <div class="flex items-center space-x-3">
                        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                        <span class="text-sm font-medium text-slate-600">Memuat data dari server Supabase...</span>
                    </div>
                </div>

                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3">Pegawai</th>
                            <th class="px-6 py-3">Waktu Check-In</th>
                            <th class="px-6 py-3">Basecamp / Lokasi</th>
                            <th class="px-6 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">
                        <template x-if="!loading && attendanceList.length === 0">
                            <tr>
                                <td colspan="4" class="px-6 py-8 text-center text-slate-400">Belum ada data absensi yang tersedia.</td>
                            </tr>
                        </template>

                        <template x-for="item in attendanceList" :key="item.id">
                            <tr class="hover:bg-slate-50/50 transition">
                                <td class="px-6 py-4 font-medium text-slate-700" x-text="item.employees?.name || item.employee_name || 'Tanpa Nama'"></td>
                                <td class="px-6 py-4 text-slate-600" x-text="formatDate(item.created_at)"></td>
                                <td class="px-6 py-4 text-slate-600" x-text="item.basecamp || item.location || '-'"></td>
                                <td class="px-6 py-4">
                                    <span class="px-2.5 py-1 text-xs font-medium rounded-full"
                                        :class="item.status === 'Hadir' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'"
                                        x-text="item.status || 'Hadir'">
                                    </span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        Absensi ACM &bull; Enterprise Attendance System &copy; 2026
    </footer>

    <!-- Script Koneksi dan Logika Aplikasi -->
    <script>
        // Konfigurasi Supabase (Ganti dengan URL dan Anon Key Anda)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        // Inisialisasi Klien Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('alpine:init', () => {
            Alpine.data('attendanceApp', () => ({
                attendanceList: [],
                loading: false,
                errorMessage: '',
                isConnected: true,
                currentTime: '',

                init() {
                    this.updateClock();
                    setInterval(() => this.updateClock(), 1000);
                    this.loadData();
                },

                updateClock() {
                    const now = new Date();
                    this.currentTime = now.toLocaleDateString('id-ID', { 
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', second: '2-digit' 
                    });
                },

                async loadData() {
                    this.loading = true;
                    this.errorMessage = '';
                    
                    try {
                        // Mengambil data dari tabel 'attendance' dengan relasi ke tabel 'employees' jika ada
                        const { data, error } = await supabaseClient
                            .from('attendance')
                            .select('*, employees(name, basecamp)')
                            .order('created_at', { ascending: false });

                        if (error) {
                            throw error;
                        }

                        this.attendanceList = data || [];
                        this.isConnected = true;
                    } catch (err) {
                        console.error('Gagal memuat data:', err.message || err);
                        this.errorMessage = 'Gagal memuat data dari server Supabase.';
                        this.isConnected = false;
                    } finally {
                        this.loading = false;
                    }
                },

                formatDate(dateString) {
                    if (!dateString) return '-';
                    const date = new Date(dateString);
                    return date.toLocaleString('id-ID', {
                        dateStyle: 'medium',
                        timeStyle: 'short'
                    });
                }
            }));
        });
    </script>
</body>
</html>
