<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi YOFC Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-light { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="absensiApp()">

    <header class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-extrabold text-xl">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-400 bg-clip-text text-transparent">YOFC TEAM ATTENDANCE</h1>
                <p class="text-xs text-slate-400 font-medium">Secure Geofencing Portal</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button @click="switchRole()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition font-semibold text-amber-400">
                <i class="fa-solid fa-rotate mr-1"></i> Mode: <span x-text="isAdminView ? 'Admin / Staff Portal' : 'Karyawan (HP)'"></span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

        <!-- KARYAWAN PORTAL -->
        <template x-if="!isAdminView">
            <div class="max-w-md mx-auto">
                <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-black text-slate-900">Check-in Kehadiran</h2>
                        <p class="text-xs font-semibold text-slate-600 mt-1">Uji Coba: ID <strong class="text-amber-600">rudi01</strong> | Pass <strong class="text-amber-600">123456</strong></p>
                    </div>

                    <form @submit.prevent="handleCheckIn" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID Karyawan</label>
                            <input type="text" x-model="loginId" autocapitalize="none" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 outline-none" placeholder="Contoh: rudi01">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                            <input type="password" x-model="loginPass" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 outline-none" placeholder="••••••••">
                        </div>

                        <button type="submit" :disabled="isSubmitting" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 hover:opacity-95 transition">
                            <span x-show="!isSubmitting"><i class="fa-solid fa-location-arrow mr-2"></i> CHECK-IN SEKARANG</span>
                            <span x-show="isSubmitting">MENYIMPAN DATA...</span>
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- ADMIN / STAFF PORTAL -->
        <template x-if="isAdminView">
            <div class="space-y-6">
                <!-- LOGIN ADMIN -->
                <template x-if="!isAdminLoggedIn">
                    <div class="max-w-md mx-auto mt-12">
                        <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                            <div class="text-center mb-6">
                                <h2 class="text-2xl font-black text-slate-900">Login Portal Admin</h2>
                                <p class="text-xs text-slate-500 mt-1">Master User: <strong>admin</strong> | Pass: <strong>Ounyenk2018#</strong></p>
                            </div>

                            <form @submit.prevent="handleAdminLogin" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID / Username</label>
                                    <input type="text" x-model="adminLoginUser" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 outline-none" placeholder="admin">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                    <input type="password" x-model="adminLoginPass" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 outline-none" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-4 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-base shadow-lg">LOGIN PORTAL</button>
                            </form>
                        </div>
                    </div>
                </template>

                <!-- DASHBOARD ADMIN -->
                <template x-if="isAdminLoggedIn">
                    <div class="space-y-6">
                        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-bold text-slate-200 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800" x-text="currentUserRole"></span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button @click="loadData()" class="px-3 py-2 bg-slate-800 text-amber-400 text-xs font-bold rounded-xl"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data</button>
                                <button @click="adminLogout()" class="px-3 py-2 bg-red-500/20 text-red-300 rounded-xl text-xs font-bold">Logout</button>
                            </div>
                        </div>

                        <!-- TAB REKAP -->
                        <div class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex justify-between items-center">
                                <h2 class="text-xl font-bold text-white">Rekapitulasi Absensi (Live & Supabase)</h2>
                                <span class="text-xs text-slate-400">Total Baris: <strong class="text-amber-400" x-text="attendanceLogs.length"></strong></span>
                            </div>
                            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                                            <th class="p-4">ID</th>
                                            <th class="p-4">Waktu</th>
                                            <th class="p-4">ID Karyawan</th>
                                            <th class="p-4">Nama</th>
                                            <th class="p-4">Role</th>
                                            <th class="p-4">Basecamp</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        <template x-for="item in attendanceLogs" :key="item.id">
                                            <tr class="hover:bg-slate-900/50 transition">
                                                <td class="p-4 font-mono text-slate-400" x-text="item.id"></td>
                                                <td class="p-4 font-semibold text-slate-300" x-text="item.timestamp"></td>
                                                <td class="p-4 font-mono text-amber-400" x-text="item.empId"></td>
                                                <td class="p-4 font-bold text-white" x-text="item.name"></td>
                                                <td class="p-4 text-slate-400" x-text="item.role"></td>
                                                <td class="p-4 text-amber-300 font-semibold" x-text="item.basecamp"></td>
                                            </tr>
                                        </template>
                                        <template x-if="attendanceLogs.length === 0">
                                            <tr>
                                                <td colspan="6" class="p-8 text-center text-slate-500 italic">Belum ada data absensi tercatat.</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- DEBUGGER DI LAYAR -->
                        <div class="glass-card p-6 rounded-3xl space-y-3">
                            <h3 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-terminal mr-2"></i> Log Status Sistem di Layar</h3>
                            <div class="bg-slate-950 p-4 rounded-xl font-mono text-xs text-emerald-400 h-32 overflow-y-auto border border-slate-800">
                                <template x-for="log in debugLogs">
                                    <div x-text="log" class="mb-1"></div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </main>

    <script>
        const SUPABASE_URL = 'https://wtvwugzwjywnzughmcts.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0dnd1Z3p3anl3bnp1Z2htY3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzEyNjQsImV4cCI6MjEwMTUwNzI2NH0.iC2CNTEYKdVAtyvNSBAEw108SrKgNH__3zbOq0HP7jM';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getLocalDate() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function absensiApp() {
            return {
                isAdminView: false,
                isAdminLoggedIn: false,
                adminLoginUser: '',
                adminLoginPass: '',
                currentUserRole: '',
                
                loginId: 'rudi01', 
                loginPass: '123456',
                isSubmitting: false,

                attendanceLogs: [],
                debugLogs: ['Sistem siap diinisialisasi.'],

                logMsg(msg) {
                    const time = new Date().toLocaleTimeString();
                    this.debugLogs.unshift(`[${time}] ${msg}`);
                },

                async init() {
                    this.logMsg("Memuat data awal...");
                    // Muat cadangan lokal terlebih dahulu agar langsung tampil
                    const localData = localStorage.getItem('yofc_attendance');
                    if (localData) {
                        try {
                            this.attendanceLogs = JSON.parse(localData);
                            this.logMsg("Berhasil memuat " + this.attendanceLogs.length + " data dari penyimpanan lokal.");
                        } catch(e) {}
                    }
                    await this.loadData();
                },

                async loadData() {
                    this.logMsg("Menghubungkan ke Supabase...");
                    try {
                        const { data, error } = await _supabase
                            .from('attendance')
                            .select('*')
                            .order('id', { ascending: false });

                        if (error) {
                            this.logMsg("Supabase Error: " + error.message);
                        } else if (data && data.length > 0) {
                            this.logMsg("Berhasil mengambil " + data.length + " baris dari Supabase.");
                            this.attendanceLogs = data.map(i => ({
                                id: i.id,
                                empId: i.emp_id,
                                name: i.name,
                                role: i.role,
                                basecamp: i.basecamp,
                                timestamp: i.timestamp,
                                date: i.date,
                                accuracy: i.accuracy
                            }));
                            localStorage.setItem('yofc_attendance', JSON.stringify(this.attendanceLogs));
                        } else {
                            this.logMsg("Supabase terhubung, namun tabel attendance kosong.");
                        }
                    } catch (err) {
                        this.logMsg("Koneksi Supabase Gagal / Offline Mode Aktif.");
                    }
                },

                switchRole() { 
                    this.isAdminView = !this.isAdminView; 
                    if (this.isAdminView) this.loadData(); 
                    else this.isAdminLoggedIn = false; 
                },

                handleAdminLogin() {
                    if (this.adminLoginUser === 'admin' && this.adminLoginPass === 'Ounyenk2018#') {
                        this.isAdminLoggedIn = true; 
                        this.currentUserRole = 'Master Admin';
                        this.adminLoginUser = ''; this.adminLoginPass = ''; 
                        this.loadData();
                    } else {
                        alert('Login Gagal! Gunakan admin / Ounyenk2018#');
                    }
                },

                adminLogout() { 
                    this.isAdminLoggedIn = false; 
                },

                async handleCheckIn() {
                    if (!this.loginId || !this.loginPass) {
                        alert('Mohon masukkan ID Karyawan dan Password!');
                        return;
                    }

                    if (this.loginId !== 'rudi01' || this.loginPass !== '123456') {
                        alert('ID atau Password salah! Gunakan rudi01 / 123456');
                        return;
                    }

                    this.isSubmitting = true;
                    this.logMsg("Memproses Check-in untuk ID: " + this.loginId);

                    const now = new Date();
                    const record = {
                        emp_id: this.loginId,
                        name: 'Rudi Batubara',
                        role: 'Project Manager',
                        basecamp: 'HO Pekanbaru',
                        timestamp: now.toLocaleString('id-ID'),
                        date: getLocalDate(),
                        accuracy: 5
                    };

                    // 1. Simpan secara lokal agar langsung tampil seketika di rekapitulasi
                    const newEntry = {
                        id: 'LOCAL-' + Date.now().toString().slice(-4),
                        empId: record.emp_id,
                        name: record.name,
                        role: record.role,
                        basecamp: record.basecamp,
                        timestamp: record.timestamp,
                        date: record.date,
                        accuracy: record.accuracy
                    };
                    this.attendanceLogs.unshift(newEntry);
                    localStorage.setItem('yofc_attendance', JSON.stringify(this.attendanceLogs));

                    try {
                        // 2. Kirim ke Supabase
                        const { data, error } = await _supabase
                            .from('attendance')
                            .insert([{
                                emp_id: record.emp_id,
                                name: record.name,
                                role: record.role,
                                basecamp: record.basecamp,
                                timestamp: record.timestamp,
                                date: record.date,
                                accuracy: record.accuracy
                            }])
                            .select();

                        if (error) {
                            this.logMsg("Gagal sinkron ke Supabase: " + error.message);
                            alert('Check-in tercatat lokal, tapi gagal ke Supabase: ' + error.message);
                        } else {
                            this.logMsg("Sukses tersimpan permanen di Supabase!");
                            alert('Sukses! Check-in berhasil dan tersinkron ke Supabase.');
                            this.loginId = '';
                            this.loginPass = '';
                            await this.loadData();
                        }
                    } catch (e) {
                        this.logMsg("Exception jaringan Supabase: " + e.message);
                        alert('Check-in berhasil disimpan di perangkat lokal.');
                    } finally {
                        this.isSubmitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
