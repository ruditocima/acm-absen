<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi YOFC Team</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-light { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        #basecampMap { height: 250px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="absensiApp()">

    <!-- HEADER / NAVBAR -->
    <header class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-extrabold text-xl">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-400 bg-clip-text text-transparent">YOFC TEAM ATTENDANCE</h1>
                <p class="text-xs text-slate-400 font-medium">Secure Geofencing Portal</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button @click="switchRole()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition font-semibold text-amber-400">
                <i class="fa-solid fa-rotate mr-1"></i> Mode: <span x-text="isAdminView ? 'Admin / PM' : 'Karyawan (HP)'"></span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- BLOCKED DESKTOP VIEW FOR EMPLOYEES (EXCEPT SIMULATION MODE) -->
        <template x-if="!isAdminView && isDesktopDevice && !simulationMode">
            <div class="max-w-md mx-auto mt-16 glass-card p-8 rounded-3xl text-center shadow-2xl border border-red-500/20">
                <div class="w-20 h-20 bg-red-500/10 text-red-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Akses Dibatasi</h2>
                <p class="text-slate-400 text-sm mb-6">Sistem Absensi Karyawan hanya diizinkan melalui perangkat <strong>Smartphone (HP)</strong>.</p>
                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs p-3 rounded-xl mb-6">
                    <i class="fa-solid fa-info-circle mr-1"></i> Jika Anda Administrator di Laptop, aktifkan <strong>Mode Simulasi</strong> di panel Admin atau sudut atas untuk menguji portal karyawan.
                </div>
            </div>
        </template>

        <!-- KARYAWAN CHECK-IN PORTAL (MOBILE OR SIMULATION MODE) -->
        <template x-if="!isAdminView && (!isDesktopDevice || simulationMode)">
            <div class="max-w-md mx-auto">
                <!-- High Brightness Outdoor Banner -->
                <div class="bg-amber-400 text-slate-950 p-4 rounded-2xl mb-6 shadow-xl flex items-center justify-between font-bold">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-sun text-xl animate-spin"></i>
                        <span class="text-sm">MODE CERAH LUAR RUANGAN AKTIF</span>
                    </div>
                    <span class="text-xs bg-slate-950 text-amber-400 px-2 py-1 rounded-md" x-show="simulationMode">Simulasi On</span>
                </div>

                <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-black text-slate-900">Check-in Kehadiran</h2>
                        <p class="text-xs font-semibold text-slate-600 mt-1">Masukkan ID Karyawan dan Password Anda</p>
                    </div>

                    <form @submit.prevent="handleCheckIn" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID Karyawan</label>
                            <input type="text" x-model="loginId" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: EMP001">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                            <input type="password" x-model="loginPass" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
                        </div>

                        <!-- GPS & Basecamp Status Box -->
                        <div class="bg-slate-900 text-slate-100 p-4 rounded-2xl text-xs space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Status GPS:</span>
                                <span class="font-bold text-emerald-400" x-text="gpsStatus"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Basecamp Terdekat:</span>
                                <span class="font-bold text-amber-400" x-text="detectedBasecamp ? detectedBasecamp.name : 'Mencari Lokasi...'"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Akurasi & Keamanan GPS:</span>
                                <span class="font-bold" :class="gpsAccuracy < 50 ? 'text-emerald-400' : 'text-red-400'" x-text="gpsAccuracy ? gpsAccuracy + ' meter' : 'Memuat...'"></span>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 hover:opacity-95 transition transform active:scale-95">
                            <i class="fa-solid fa-location-arrow mr-2"></i> CHECK-IN SEKARANG
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- ADMIN / PROJECT MANAGER PORTAL -->
        <template x-if="isAdminView">
            <div class="space-y-6">

                <!-- 1. FORM LOGIN ADMIN / PM (JIKA BELUM LOGIN) -->
                <template x-if="!isAdminLoggedIn">
                    <div class="max-w-md mx-auto mt-12">
                        <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                            <div class="text-center mb-6">
                                <div class="w-16 h-16 bg-amber-500/10 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <h2 class="text-2xl font-black text-slate-900">Login Admin / PM</h2>
                                <p class="text-xs font-semibold text-slate-600 mt-1">Masukkan kredensial khusus Administrator atau Project Manager</p>
                            </div>

                            <form @submit.prevent="handleAdminLogin" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID / Username Admin</label>
                                    <input type="text" x-model="adminLoginUser" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: admin atau EMP001">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                    <input type="password" x-model="adminLoginPass" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
                                </div>

                                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-800 text-xs p-3 rounded-xl">
                                    <i class="fa-solid fa-info-circle mr-1"></i> <strong>Info Default:</strong> Username: <code class="bg-amber-100 px-1 py-0.5 rounded font-mono">admin</code> / Password: <code class="bg-amber-100 px-1 py-0.5 rounded font-mono">admin123</code> (atau gunakan akun EMP001).
                                </div>

                                <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 hover:opacity-95 transition transform active:scale-95">
                                    <i class="fa-solid fa-right-to-bracket mr-2"></i> LOGIN ADMIN
                                </button>
                            </form>
                        </div>
                    </div>
                </template>

                <!-- 2. DASHBOARD ADMIN / PM (JIKA SUDAH LOGIN) -->
                <template x-if="isAdminLoggedIn">
                    <div class="space-y-6">
                        <!-- Top Control Bar -->
                        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <span class="px-3 py-1 bg-amber-500/20 text-amber-400 rounded-lg text-xs font-bold border border-amber-500/30">Admin Dashboard</span>
                                <!-- Simulation Toggle -->
                                <label class="flex items-center cursor-pointer bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                                    <input type="checkbox" x-model="simulationMode" class="sr-only peer">
                                    <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-amber-500 relative"></div>
                                    <span class="ml-2 text-xs font-bold text-slate-300">[Mode Simulasi: Abaikan pengecekan perangkat]</span>
                                </label>
                            </div>

                            <div class="flex items-center space-x-3">
                                <!-- Tabs -->
                                <div class="flex space-x-2">
                                    <button @click="adminTab = 'rekap'" :class="adminTab === 'rekap' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-clipboard-user mr-1"></i> Rekap Absensi
                                    </button>
                                    <button @click="adminTab = 'basecamp'" :class="adminTab === 'basecamp' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-map-location-dot mr-1"></i> Basecamp
                                    </button>
                                    <button @click="adminTab = 'karyawan'" :class="adminTab === 'karyawan' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-users-gear mr-1"></i> Data Karyawan
                                    </button>
                                </div>
                                <!-- Admin Logout Button -->
                                <button @click="adminLogout()" class="px-3 py-2 bg-red-500/25 hover:bg-red-500/40 text-red-300 border border-red-500/30 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                                </button>
                            </div>
                        </div>

                        <!-- TAB 1: REKAP ABSENSI -->
                        <div x-show="adminTab === 'rekap'" class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex flex-wrap justify-between items-center gap-4">
                                <div>
                                    <h2 class="text-xl font-bold text-white">Rekapitulasi Absensi Seluruh Karyawan</h2>
                                    <p class="text-xs text-slate-400">Filter berdasarkan rentang waktu dan export ke CSV.</p>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <div>
                                        <label class="block text-[10px] text-slate-400 uppercase font-bold">Dari Tanggal</label>
                                        <input type="date" x-model="filterStartDate" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-slate-200">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-slate-400 uppercase font-bold">Sampai Tanggal</label>
                                        <input type="date" x-model="filterEndDate" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-slate-200">
                                    </div>
                                    <button @click="exportCSV" class="mt-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-emerald-600/30">
                                        <i class="fa-solid fa-file-csv mr-1"></i> Export CSV
                                    </button>
                                </div>
                            </div>

                            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                                            <th class="p-4">Tanggal & Waktu</th>
                                            <th class="p-4">ID</th>
                                            <th class="p-4">Nama</th>
                                            <th class="p-4">Role</th>
                                            <th class="p-4">Basecamp</th>
                                            <th class="p-4">Status GPS</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        <template x-for="item in filteredAttendance" :key="item.id">
                                            <tr class="hover:bg-slate-900/50 transition">
                                                <td class="p-4 font-semibold text-slate-300" x-text="item.timestamp"></td>
                                                <td class="p-4 font-mono text-amber-400" x-text="item.empId"></td>
                                                <td class="p-4 font-bold text-white" x-text="item.name"></td>
                                                <td class="p-4 text-slate-400" x-text="item.role"></td>
                                                <td class="p-4"><span class="px-2.5 py-1 bg-slate-800 rounded-lg text-amber-300 border border-slate-700 font-semibold" x-text="item.basecamp"></span></td>
                                                <td class="p-4 text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Verified (<span x-text="item.accuracy"></span>m)</td>
                                            </tr>
                                        </template>
                                        <template x-if="filteredAttendance.length === 0">
                                            <tr>
                                                <td colspan="6" class="p-8 text-center text-slate-500 italic">Belum ada data absensi pada rentang waktu ini.</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- TAB 2: MANAJEMEN BASECAMP -->
                        <div x-show="adminTab === 'basecamp'" class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="text-xl font-bold text-white">Kelola Lokasi Basecamp</h2>
                                    <p class="text-xs text-slate-400">Tambah atau edit koordinat GPS dan radius geofencing basecamp.</p>
                                </div>
                                <button @click="openBasecampModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold rounded-xl transition shadow-lg shadow-amber-500/20">
                                    <i class="fa-solid fa-plus mr-1"></i> Tambah Basecamp
                                </button>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                <template x-for="(bc, index) in basecamps" :key="bc.id">
                                    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex flex-col justify-between space-y-4">
                                        <div>
                                            <div class="flex justify-between items-start mb-2">
                                                <h3 class="font-extrabold text-base text-white" x-text="bc.name"></h3>
                                                <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20" x-text="bc.radius + ' meter'"></span>
                                            </div>
                                            <p class="text-xs text-slate-400 font-mono"><i class="fa-solid fa-location-crosshairs mr-1 text-amber-500"></i> Lat: <span x-text="bc.lat"></span>, Lng: <span x-text="bc.lng"></span></p>
                                        </div>
                                        <div class="flex space-x-2 pt-2 border-t border-slate-800">
                                            <button @click="editBasecamp(index)" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition">Edit</button>
                                            <button @click="deleteBasecamp(index)" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-bold rounded-xl transition"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- TAB 3: MANAJEMEN KARYAWAN -->
                        <div x-show="adminTab === 'karyawan'" class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="text-xl font-bold text-white">Kelola Data Karyawan</h2>
                                    <p class="text-xs text-slate-400">Tambah, edit akun, password, dan reset perangkat terikat karyawan.</p>
                                </div>
                                <button @click="openEmployeeModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold rounded-xl transition shadow-lg shadow-amber-500/20">
                                    <i class="fa-solid fa-user-plus mr-1"></i> Tambah Karyawan
                                </button>
                            </div>

                            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                                            <th class="p-4">ID Karyawan</th>
                                            <th class="p-4">Nama Lengkap</th>
                                            <th class="p-4">Role / Posisi</th>
                                            <th class="p-4">Password</th>
                                            <th class="p-4">Status Device HP</th>
                                            <th class="p-4 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        <template x-for="(emp, index) in employees" :key="emp.id">
                                            <tr class="hover:bg-slate-900/50 transition">
                                                <td class="p-4 font-mono font-bold text-amber-400" x-text="emp.id"></td>
                                                <td class="p-4 font-bold text-white" x-text="emp.name"></td>
                                                <td class="p-4 text-slate-300" x-text="emp.role"></td>
                                                <td class="p-4 font-mono text-slate-400" x-text="emp.password"></td>
                                                <td class="p-4">
                                                    <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold" :class="emp.deviceId ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400'" x-text="emp.deviceId ? 'Terikat 1 Device' : 'Belum Terikat'"></span>
                                                </td>
                                                <td class="p-4 text-center space-x-2">
                                                    <button @click="resetDevice(index)" title="Reset Device" class="px-2.5 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 rounded-lg transition" x-show="emp.deviceId"><i class="fa-solid fa-mobile-screen mr-1"></i> Reset HP</button>
                                                    <button @click="editEmployee(index)" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition"><i class="fa-solid fa-pen"></i></button>
                                                    <button @click="deleteEmployee(index)" class="px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>

            </div>
        </template>
    </main>

    <!-- MODAL FORM BASECAMP (WITH LEAFLET MAP INTEGRATION) -->
    <div x-show="showBasecampModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
        <div class="glass-card max-w-lg w-full p-6 rounded-3xl space-y-4 border border-slate-700 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-white" x-text="editBasecampIndex !== null ? 'Edit Basecamp' : 'Tambah Basecamp Baru'"></h3>
            <form @submit.prevent="saveBasecamp" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nama Basecamp</label>
                    <input type="text" x-model="basecampForm.name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                
                <!-- Peta Interaktif Leaflet -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Pilih Titik Lokasi (Klik Peta atau Geser Marker)</label>
                    <div id="basecampMap"></div>
                    <p class="text-[10px] text-slate-400 mt-1 italic">Lingkaran menunjukkan visualisasi radius geofencing basecamp.</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Latitude</label>
                        <input type="number" step="any" x-model="basecampForm.lat" @input="updateMapFromInputs" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Longitude</label>
                        <input type="number" step="any" x-model="basecampForm.lng" @input="updateMapFromInputs" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Radius (Meter)</label>
                    <input type="number" x-model="basecampForm.radius" @input="updateMapFromInputs" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: 150">
                </div>
                <div class="flex justify-end space-x-2 pt-4">

    <!-- JAVASCRIPT LOGIC & STABLE BROWSER FINGERPRINT / NATIVE MOCK DETECTION INTEGRATION -->
    <script>
        // Fungsi Generator Browser Fingerprint yang Stabil & Mendukung Hybrid App (Capacitor/Cordova)
        async function getOrCreateStableDeviceIdentifier() {
            let deviceId = localStorage.getItem('bc_device_uuid');
            if (deviceId) return deviceId;

            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Device) {
                try {
                    const info = await window.Capacitor.Plugins.Device.getId();
                    if (info && info.identifier) {
                        deviceId = 'NATIVE-' + info.identifier;
                        localStorage.setItem('bc_device_uuid', deviceId);
                        return deviceId;
                    }
                } catch (e) {
                    console.warn('Native device bridge not accessible, falling back to browser fingerprint.');
                }
            }

            const fingerprintComponents = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 'unknown',
                navigator.deviceMemory || 'unknown'
            ].join('|||');

            let hash = 0;
            for (let i = 0; i < fingerprintComponents.length; i++) {
                const char = fingerprintComponents.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }

            deviceId = 'FP-' + Math.abs(hash).toString(36).toUpperCase() + '-' + Math.abs(screen.width * screen.height).toString(36).toUpperCase();
            localStorage.setItem('bc_device_uuid', deviceId);
            document.cookie = `bc_device_uuid=${deviceId}; max-age=31536000; path=/; SameSite=Strict`;

            return deviceId;
        }

        // Fungsi Deteksi Mock Location / Fake GPS secara Native (Capacitor / Cordova) & Web Properti
        async function checkIsMockLocation(coords) {
            // 1. Cek properti HTML5 Geolocation standar jika didukung browser/webview
            if (coords && coords.isMocked === true) {
                return true;
            }

            // 2. Cek integrasi plugin native Capacitor (misal: plugin capacitor-check-ismock-location)
            if (window.Capacitor && window.Capacitor.Plugins) {
                try {
                    if (window.Capacitor.Plugins.Location && typeof window.Capacitor.Plugins.Location.isMocked === 'function') {
                        const res = await window.Capacitor.Plugins.Location.isMocked();
                        if (res && (res.isMocked || res.value === true)) {
                            return true;
                        }
                    }
                    if (window.Capacitor.Plugins.MockLocation && typeof window.Capacitor.Plugins.MockLocation.check === 'function') {
                        const res = await window.Capacitor.Plugins.MockLocation.check();
                        if (res && res.isMocked) {
                            return true;
                        }
                    }
                } catch (e) {
                    console.warn('Native mock location plugin check warning:', e);
                }
            }

            return false;
        }

        // Simulasi Controller Sisi Server (Backend API Simulation) dengan Strict Mock Check
        async function simulateServerSideValidation(payload) {
            return new Promise((resolve) => {
                setTimeout(async () => {
                    const { loginId, loginPass, currentCoords, gpsAccuracy, simulationMode, deviceId } = payload;
                    
                    const serverEmployees = JSON.parse(localStorage.getItem('bc_employees')) || [];
                    const serverBasecamps = JSON.parse(localStorage.getItem('bc_basecamps')) || [];
                    const serverAttendance = JSON.parse(localStorage.getItem('bc_attendance')) || [];

                    const emp = serverEmployees.find(e => e.id === loginId && e.password === loginPass);
                    if (!emp) {
                        resolve({ success: false, message: 'ID Karyawan atau Password salah!' });
                        return;
                    }

                    if (!emp.deviceId) {
                        emp.deviceId = deviceId;
                        localStorage.setItem('bc_employees', JSON.stringify(serverEmployees));
                    } else if (emp.deviceId !== deviceId && !simulationMode) {
                        resolve({ success: false, message: 'Akses ditolak! Akun ini sudah terikat dengan perangkat HP lain. Hubungi Administrator.' });
                        return;
                    }

                    const today = new Date().toISOString().split('T')[0];
                    const alreadyCheckedIn = serverAttendance.some(log => log.empId === emp.id && log.date === today);
                    if (alreadyCheckedIn) {
                        resolve({ success: false, message: 'Anda sudah melakukan check-in hari ini. Hanya diizinkan 1 kali sehari.' });
                        return;
                    }

                    // Pengecekan Mock Location ketat (Native Plugin / Web / Akurasi)
                    const isMockDetected = await checkIsMockLocation(currentCoords);
                    if ((gpsAccuracy > 50 || isMockDetected) && !simulationMode) {
                        resolve({ success: false, message: 'Check-in gagal (Server Validation): Terdeteksi penggunaan Fake GPS / Mock Location atau akurasi GPS buruk!' });
                        return;
                    }

                    let verifiedBasecamp = null;
                    if (simulationMode) {
                        verifiedBasecamp = { name: 'Simulasi Basecamp (Admin)' };
                    } else if (currentCoords) {
                        for (let bc of serverBasecamps) {
                            const R = 6371e3;
                            const φ1 = currentCoords.lat * Math.PI/180;
                            const φ2 = bc.lat * Math.PI/180;
                            const Δφ = (bc.lat - currentCoords.lat) * Math.PI/180;
                            const Δλ = (bc.lng - currentCoords.lng) * Math.PI/180;
                            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                                      Math.cos(φ1) * Math.cos(φ2) *
                                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                            const distance = R * c;

                            if (distance <= bc.radius) {
                                verifiedBasecamp = bc;
                                break;
                            }
                        }
                    }

                    if (!verifiedBasecamp && !simulationMode) {
                        resolve({ success: false, message: 'Validasi Server Gagal: Koordinat Anda berada di luar radius Basecamp manapun!' });
                        return;
                    }

                    const basecampName = verifiedBasecamp ? verifiedBasecamp.name : 'Simulasi Basecamp (Admin)';

                    const newLog = {
                        id: Date.now(),
                        empId: emp.id,
                        name: emp.name,
                        role: emp.role,
                        basecamp: basecampName,
                        timestamp: new Date().toLocaleString('id-ID'),
                        date: today,
                        accuracy: gpsAccuracy || 5
                    };

                    serverAttendance.unshift(newLog);
                    localStorage.setItem('bc_attendance', JSON.stringify(serverAttendance));

                    resolve({ success: true, message: `Berhasil Check-in! Selamat bekerja, ${emp.name} di ${basecampName}.` });
                }, 400);
            });
        }

        function absensiApp() {
            return {
                isAdminView: false,
                isAdminLoggedIn: false,
                adminLoginUser: '',
                adminLoginPass: '',
                adminTab: 'rekap',
                simulationMode: false,
                isDesktopDevice: window.innerWidth >= 1024,
                
                // Form States
                loginId: '',
                loginPass: '',
                gpsStatus: 'Mendeteksi GPS...',
                gpsAccuracy: null,
                currentCoords: null,
                detectedBasecamp: null,

                // Filter Rekap
                filterStartDate: new Date().toISOString().split('T')[0],
                filterEndDate: new Date().toISOString().split('T')[0],

                // Leaflet Map State for Basecamp Modal
                map: null,
                marker: null,
                circle: null,

                // Modals
                showBasecampModal: false,
                editBasecampIndex: null,
                basecampForm: { name: '', lat: -2.990934, lng: 104.756554, radius: 100 },

                showEmployeeModal: false,
                editEmployeeIndex: null,
                employeeForm: { id: '', name: '', role: '', password: '', deviceId: null },

                // Persistent Data (LocalStorage)
                basecamps: JSON.parse(localStorage.getItem('bc_basecamps')) || [
                    { id: 1, name: 'Basecamp Palembang', lat: -2.990934, lng: 104.756554, radius: 150 },
                    { id: 2, name: 'Basecamp Padang', lat: -0.947083, lng: 100.354274, radius: 150 },
                    { id: 3, name: 'Basecamp Pekanbaru', lat: 0.507068, lng: 101.447779, radius: 150 }
                ],
                employees: JSON.parse(localStorage.getItem('bc_employees')) || [
                    { id: 'EMP001', name: 'Rudi Batubara', role: 'Project Coordinator', password: '123', deviceId: null },
                    { id: 'EMP002', name: 'Ahmad Fauzi', role: 'Field Technician', password: '123', deviceId: null }
                ],
                attendanceLogs: JSON.parse(localStorage.getItem('bc_attendance')) || [],

                async init() {
                    this.initGPS();
                    await getOrCreateStableDeviceIdentifier();
                },

                initGPS() {
                    if (navigator.geolocation) {
                        navigator.geolocation.watchPosition(
                            async (position) => {
                                const isMocked = position.coords.isMocked || await checkIsMockLocation(position.coords);
                                this.currentCoords = { 
                                    lat: position.coords.latitude, 
                                    lng: position.coords.longitude,
                                    isMocked: isMocked 
                                };
                                this.gpsAccuracy = Math.round(position.coords.accuracy);
                                
                                if (this.gpsAccuracy > 50 || isMocked) {
                                    this.gpsStatus = 'Peringatan: Terindikasi Mock / Fake GPS!';
                                } else {
                                    this.gpsStatus = 'GPS Aman & Akurat';
                                }

                                this.checkNearestBasecamp(this.currentCoords.lat, this.currentCoords.lng);
                            },
                            (error) => {
                                this.gpsStatus = 'Gagal mendeteksi GPS. Aktifkan lokasi.';
                            },
                            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                        );
                    } else {
                        this.gpsStatus = 'Browser tidak mendukung GPS.';
                    }
                },

                calculateDistance(lat1, lon1, lat2, lon2) {
                    const R = 6371e3;
                    const φ1 = lat1 * Math.PI/180;
                    const φ2 = lat2 * Math.PI/180;
                    const Δφ = (lat2-lat1) * Math.PI/180;
                    const Δλ = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                              Math.cos(φ1) * Math.cos(φ2) *
                              Math.sin(Δλ/2) * Math.sin(Δλ/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    return R * c;
                },

                checkNearestBasecamp(lat, lng) {
                    let found = null;
                    for (let bc of this.basecamps) {
                        const dist = this.calculateDistance(lat, lng, bc.lat, bc.lng);
                        if (dist <= bc.radius) {
                            found = bc;
                            break;
                        }
                    }
                    this.detectedBasecamp = found;
                },

                switchRole() {
                    this.isAdminView = !this.isAdminView;
                    if (!this.isAdminView) {
                        this.isAdminLoggedIn = false;
                    }
                },

                handleAdminLogin() {
                    if (this.adminLoginUser === 'admin' && this.adminLoginPass === 'admin123') {
                        this.isAdminLoggedIn = true;
                        this.adminLoginUser = '';
                        this.adminLoginPass = '';
                    } else {
                        const emp = this.employees.find(e => e.id === this.adminLoginUser && e.password === this.adminLoginPass);
                        if (emp && (emp.role.toLowerCase().includes('coordinator') || emp.role.toLowerCase().includes('manager') || emp.role.toLowerCase().includes('admin'))) {
                            this.isAdminLoggedIn = true;
                            this.adminLoginUser = '';
                            this.adminLoginPass = '';
                        } else {
                            alert('ID/Username atau Password Admin/PM salah, atau hak akses tidak diizinkan!');
                        }
                    }
                },

                adminLogout() {
                    this.isAdminLoggedIn = false;
                    this.adminLoginUser = '';
                    this.adminLoginPass = '';
                },

                async handleCheckIn() {
                    if (!this.loginId || !this.loginPass) {
                        alert('Masukkan ID Karyawan dan Password!');
                        return;
                    }

                    const currentDeviceId = await getOrCreateStableDeviceIdentifier();
                    
                    const payload = {
                        loginId: this.loginId,
                        loginPass: this.loginPass,
                        currentCoords: this.currentCoords,
                        gpsAccuracy: this.gpsAccuracy,
                        simulationMode: this.simulationMode,
                        deviceId: currentDeviceId
                    };

                    this.gpsStatus = 'Memproses Validasi Server...';

                    const result = await simulateServerSideValidation(payload);

                    if (this.gpsAccuracy > 50 || (this.currentCoords && this.currentCoords.isMocked)) {
                        this.gpsStatus = 'Peringatan: Terindikasi Mock / Fake GPS!';
                    } else {
                        this.gpsStatus = 'GPS Aman & Akurat';
                    }

                    if (!result.success) {
                        alert(result.message);
                        return;
                    }

                    alert(result.message);
                    this.loginId = '';
                    this.loginPass = '';
                    
                    this.attendanceLogs = JSON.parse(localStorage.getItem('bc_attendance')) || [];
                    this.employees = JSON.parse(localStorage.getItem('bc_employees')) || [];
                },

                // Leaflet Map Methods for Basecamp Modal
                initMap() {
                    const lat = parseFloat(this.basecampForm.lat) || -2.990934;
                    const lng = parseFloat(this.basecampForm.lng) || 104.756554;
                    const radius = parseInt(this.basecampForm.radius) || 100;

                    if (!this.map) {
                        this.map = L.map('basecampMap').setView([lat, lng], 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            maxZoom: 19,
                            attribution: '&copy; OpenStreetMap contributors'
                        }).addTo(this.map);

                        this.marker = L.marker([lat, lng], { draggable: true }).addTo(this.map);
                        this.circle = L.circle([lat, lng], { radius: radius, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.2 }).addTo(this.map);

                        this.marker.on('dragend', (e) => {
                            const pos = e.target.getLatLng();
                            this.basecampForm.lat = parseFloat(pos.lat.toFixed(6));
                            this.basecampForm.lng = parseFloat(pos.lng.toFixed(6));
                            this.updateMapVisuals();
                        });

                        this.map.on('click', (e) => {
                            this.basecampForm.lat = parseFloat(e.latlng.lat.toFixed(6));
                            this.basecampForm.lng = parseFloat(e.latlng.lng.toFixed(6));
                            this.marker.setLatLng(e.latlng);
                            this.updateMapVisuals();
                        });
                    } else {
                        this.map.invalidateSize();
                        this.map.setView([lat, lng], 15);
                        this.marker.setLatLng([lat, lng]);
                        this.circle.setLatLng([lat, lng]);
                        this.circle.setRadius(radius);
                    }
                },

                updateMapVisuals() {
                    const lat = parseFloat(this.basecampForm.lat);
                    const lng = parseFloat(this.basecampForm.lng);
                    const radius = parseInt(this.basecampForm.radius) || 100;
                    if (!isNaN(lat) && !isNaN(lng)) {
                        this.circle.setLatLng([lat, lng]);
                        this.circle.setRadius(radius);
                    }
                },

                updateMapFromInputs() {
                    const lat = parseFloat(this.basecampForm.lat);
                    const lng = parseFloat(this.basecampForm.lng);
                    const radius = parseInt(this.basecampForm.radius) || 100;
                    if (!isNaN(lat) && !isNaN(lng) && this.map) {
                        this.marker.setLatLng([lat, lng]);
                        this.circle.setLatLng([lat, lng]);
                        this.circle.setRadius(radius);
                        this.map.setView([lat, lng], this.map.getZoom());
                    }
                },

                // CRUD Basecamp
                openBasecampModal() {
                    this.editBasecampIndex = null;
                    this.basecampForm = { name: '', lat: -2.990934, lng: 104.756554, radius: 150 };
                    this.showBasecampModal = true;
                    this.$nextTick(() => {
                        this.initMap();
                    });
                },
                editBasecamp(index) {
                    this.editBasecampIndex = index;
                    this.basecampForm = { ...this.basecamps[index] };
                    this.showBasecampModal = true;
                    this.$nextTick(() => {
                        this.initMap();
                    });
                },
                saveBasecamp() {
                    if (this.editBasecampIndex !== null) {
                        this.basecamps[this.editBasecampIndex] = { ...this.basecampForm, id: this.basecamps[this.editBasecampIndex].id };
                    } else {
                        this.basecampForm.id = Date.now();
                        this.basecamps.push({ ...this.basecampForm });
                    }
                    localStorage.setItem('bc_basecamps', JSON.stringify(this.basecamps));
                    this.showBasecampModal = false;
                },
                deleteBasecamp(index) {
                    if (confirm('Hapus basecamp ini?')) {
                        this.basecamps.splice(index, 1);
                        localStorage.setItem('bc_basecamps', JSON.stringify(this.basecamps));
                    }
                },

                // CRUD Employee
                openEmployeeModal() {
                    this.editEmployeeIndex = null;
                    this.employeeForm = { id: '', name: '', role: '', password: '', deviceId: null };
                    this.showEmployeeModal = true;
                },
                editEmployee(index) {
                    this.editEmployeeIndex = index;
                    this.employeeForm = { ...this.employees[index] };
                    this.showEmployeeModal = true;
                },
                saveEmployee() {
                    if (this.editEmployeeIndex !== null) {
                        this.employees[this.editEmployeeIndex] = { ...this.employeeForm };
                    } else {
                        this.employees.push({ ...this.employeeForm });
                    }
                    this.saveEmployeesToStorage();
                    this.showEmployeeModal = false;
                },
                deleteEmployee(index) {
                    if (confirm('Hapus data karyawan ini?')) {
                        this.employees.splice(index, 1);
                        this.saveEmployeesToStorage();
                    }
                },
                resetDevice(index) {
                    if (confirm(`Reset perangkat terikat untuk ${this.employees[index].name}?`)) {
                        this.employees[index].deviceId = null;
                        this.saveEmployeesToStorage();
                        alert('Perangkat berhasil direset.');
                    }
                },
                saveEmployeesToStorage() {
                    localStorage.setItem('bc_employees', JSON.stringify(this.employees));
                },

                get filteredAttendance() {
                    return this.attendanceLogs.filter(item => {
                        return item.date >= this.filterStartDate && item.date <= this.filterEndDate;
                    });
                },

                exportCSV() {
                    let csvContent = "data:text/csv;charset=utf-8,ID,Nama,Role,Basecamp,Tanggal Waktu,Akurasi GPS\n";
                    this.filteredAttendance.forEach(row => {
                        csvContent += `"${row.empId}","${row.name}","${row.role}","${row.basecamp}","${row.timestamp}","${row.accuracy}m"\r\n`;
                    });
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `rekap_absensi_${this.filterStartDate}_sampai_${this.filterEndDate}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
    </script>
