<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi YOFC Team</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-light { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        #basecampMap { height: 250px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="absensiApp()">

    <!-- HEADER / NAVBAR -->
    <header class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-extrabold text-xl">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-400 bg-clip-text text-transparent">YOFC TEAM ATTENDANCE</h1>
                <p class="text-xs text-slate-400 font-medium">Secure Geofencing Portal</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button @click="switchRole()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition font-semibold text-amber-400">
                <i class="fa-solid fa-rotate mr-1"></i> Mode: <span x-text="isAdminView ? 'Admin / Staff Portal' : 'Karyawan (HP)'"></span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- BLOCKED DESKTOP VIEW FOR EMPLOYEES (EXCEPT SIMULATION MODE) -->
        <template x-if="!isAdminView && isDesktopDevice && !simulationMode">
            <div class="max-w-md mx-auto mt-16 glass-card p-8 rounded-3xl text-center shadow-2xl border border-red-500/20">
                <div class="w-20 h-20 bg-red-500/10 text-red-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Akses Dibatasi</h2>
                <p class="text-slate-400 text-sm mb-6">Sistem Absensi Karyawan hanya diizinkan melalui perangkat <strong>Smartphone (HP)</strong>.</p>
                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs p-3 rounded-xl mb-6">
                    <i class="fa-solid fa-info-circle mr-1"></i> Jika Anda Administrator di Laptop, aktifkan <strong>Mode Simulasi</strong> di panel Admin atau sudut atas untuk menguji portal karyawan.
                </div>
            </div>
        </template>

        <!-- KARYAWAN CHECK-IN & IZIN PORTAL -->
        <template x-if="!isAdminView && (!isDesktopDevice || simulationMode)">
            <div class="max-w-md mx-auto">
                <div class="bg-amber-400 text-slate-950 p-4 rounded-2xl mb-6 shadow-xl flex items-center justify-between font-bold">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-sun text-xl animate-spin"></i>
                        <span class="text-sm">MODE CERAH LUAR RUANGAN AKTIF</span>
                    </div>
                    <span class="text-xs bg-slate-950 text-amber-400 px-2 py-1 rounded-md" x-show="simulationMode">Simulasi On</span>
                </div>

                <div class="flex bg-slate-900 p-1.5 rounded-2xl mb-6 border border-slate-800">
                    <button @click="employeeTab = 'checkin'" :class="employeeTab === 'checkin' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'" class="flex-1 py-2 rounded-xl text-xs transition text-center">
                        <i class="fa-solid fa-fingerprint mr-1"></i> Check-in Absen
                    </button>
                    <button @click="employeeTab = 'pengajuan'" :class="employeeTab === 'pengajuan' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'" class="flex-1 py-2 rounded-xl text-xs transition text-center">
                        <i class="fa-solid fa-file-pen mr-1"></i> Ajukan Izin/Sakit
                    </button>
                </div>

                <template x-if="employeeTab === 'checkin'">
                    <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-black text-slate-900">Check-in Kehadiran</h2>
                            <p class="text-xs font-semibold text-slate-600 mt-1">Batas Jam Absen: <strong x-text="employeeDeadlineText">09.45 WIB</strong></p>
                        </div>

                        <form @submit.prevent="handleCheckIn" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID Karyawan</label>
                                <input type="text" x-model="loginId" autocapitalize="none" autocorrect="off" autocomplete="off" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: rudi01">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                <input type="password" x-model="loginPass" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
                            </div>

                            <div class="bg-slate-900 text-slate-100 p-4 rounded-2xl text-xs space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Status GPS:</span>
                                    <span class="font-bold text-emerald-400" x-text="gpsStatus"></span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Basecamp Terdekat:</span>
                                    <span class="font-bold text-amber-400" x-text="detectedBasecamp ? detectedBasecamp.name : 'Mencari Lokasi...'"></span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Jarak Real-Time:</span>
                                    <span class="font-bold text-sky-400" x-text="nearestDistanceText"></span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">Akurasi GPS:</span>
                                    <span class="font-bold" :class="gpsAccuracy < 50 ? 'text-emerald-400' : 'text-red-400'" x-text="gpsAccuracy ? gpsAccuracy + ' meter' : 'Memuat...'"></span>
                                </div>
                            </div>

                            <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 hover:opacity-95 transition transform active:scale-95">
                                <i class="fa-solid fa-location-arrow mr-2"></i> CHECK-IN SEKARANG
                            </button>
                        </form>
                    </div>
                </template>

                <template x-if="employeeTab === 'pengajuan'">
                    <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white space-y-6">
                        <div class="text-center">
                            <h2 class="text-2xl font-black text-slate-900">Pengajuan Izin / Sakit</h2>
                            <p class="text-xs font-semibold text-slate-600 mt-1">Kirimkan permohonan ketidakhadiran kepada Admin/PM</p>
                        </div>

                        <form @submit.prevent="submitLeaveRequest" class="space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID Karyawan</label>
                                    <input type="text" x-model="leaveForm.empId" autocapitalize="none" autocorrect="off" autocomplete="off" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 text-xs focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: rudi01">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Jenis Pengajuan</label>
                                    <select x-model="leaveForm.type" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                                        <option value="Sakit">Sakit</option>
                                        <option value="Izin">Izin</option>
                                        <option value="Cuti">Cuti</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Dari Tanggal</label>
                                    <input type="date" x-model="leaveForm.startDate" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Sampai Tanggal</label>
                                    <input type="date" x-model="leaveForm.endDate" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Alasan / Keterangan</label>
                                <textarea x-model="leaveForm.reason" rows="3" required class="w-full px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Tuliskan alasan pengajuan..."></textarea>
                            </div>

                            <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/30 hover:opacity-95 transition transform active:scale-95">
                                <i class="fa-solid fa-paper-plane mr-2"></i> KIRIM PENGAJUAN
                            </button>
                        </form>

                        <div class="pt-4 border-t border-slate-200">
                            <h3 class="font-bold text-sm text-slate-900 mb-3">Riwayat Pengajuan Anda</h3>
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                <template x-for="item in employeeLeaves" :key="item.id">
                                    <div class="bg-slate-100 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                                        <div class="flex justify-between font-bold text-slate-900">
                                            <span x-text="item.type + ' (' + item.startDate + ' s/d ' + item.endDate + ')'"></span>
                                            <span class="px-2 py-0.5 rounded text-[10px]" 
                                                :class="item.status === 'Disetujui' ? 'bg-emerald-100 text-emerald-800' : (item.status === 'Ditolak' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800')" 
                                                x-text="item.status"></span>
                                        </div>
                                        <p class="text-slate-600 text-[11px]" x-text="item.reason"></p>
                                    </div>
                                </template>
                                <template x-if="employeeLeaves.length === 0">
                                    <p class="text-slate-500 text-xs italic text-center py-2">Masukkan ID Karyawan Anda untuk melihat riwayat.</p>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- ADMIN / STAFF PORTAL -->
        <template x-if="isAdminView">
            <div class="space-y-6">

                <!-- 1. LOGIN ADMIN -->
                <template x-if="!isAdminLoggedIn">
                    <div class="max-w-md mx-auto mt-12">
                        <div class="glass-light text-slate-900 p-6 sm:p-8 rounded-3xl shadow-2xl border border-white">
                            <div class="text-center mb-6">
                                <div class="w-16 h-16 bg-amber-500/10 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <h2 class="text-2xl font-black text-slate-900">Login Portal Staff & Admin</h2>
                            </div>

                            <form @submit.prevent="handleAdminLogin" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ID / Username</label>
                                    <input type="text" x-model="adminLoginUser" autocapitalize="none" autocorrect="off" autocomplete="off" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: admin atau rudi01">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                    <input type="password" x-model="adminLoginPass" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-300 font-bold text-slate-900 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
                                </div>

                                <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 hover:opacity-95 transition transform active:scale-95">
                                    <i class="fa-solid fa-right-to-bracket mr-2"></i> LOGIN PORTAL
                                </button>
                            </form>
                        </div>
                    </div>
                </template>

                <!-- 2. DASHBOARD ADMIN / STAFF -->
                <template x-if="isAdminLoggedIn">
                    <div class="space-y-6">
                        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-bold text-slate-200 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800" x-text="timeGreeting + ' : ' + currentUserName"></span>
                                <span class="px-3 py-1 bg-amber-500/20 text-amber-400 rounded-lg text-xs font-bold border border-amber-500/30" x-text="'Role: ' + (currentUserRole || 'Master Admin')"></span>
                                <label class="flex items-center cursor-pointer bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                                    <input type="checkbox" x-model="simulationMode" class="sr-only peer">
                                    <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-amber-500 relative"></div>
                                    <span class="ml-2 text-xs font-bold text-slate-300">[Mode Simulasi]</span>
                                </label>
                            </div>

                            <div class="flex items-center space-x-3">
                                <div class="flex flex-wrap gap-2">
                                    <!-- Rekap Absensi -->
                                    <button x-show="canAccessRekap" @click="adminTab = 'rekap'; loadAttendanceData()" :class="adminTab === 'rekap' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-clipboard-user mr-1"></i> Rekap Absensi
                                    </button>
                                    <!-- Persetujuan Izin -->
                                    <button x-show="canAccessIzin" @click="adminTab = 'izin'" :class="adminTab === 'izin' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-file-contract mr-1"></i> Persetujuan Izin
                                    </button>
                                    <!-- Kirim Pesan (Project Manager Only) -->
                                    <button x-show="canAccessMessages" @click="adminTab = 'messages'; loadMessagesData()" :class="adminTab === 'messages' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-envelope mr-1"></i> Kirim Pesan
                                    </button>
                                    <!-- Basecamp -->
                                    <button x-show="canAccessBasecamp" @click="adminTab = 'basecamp'" :class="adminTab === 'basecamp' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-map-location-dot mr-1"></i> Basecamp
                                    </button>
                                    <!-- Data Karyawan (Master Admin Only) -->
                                    <button x-show="canAccessKaryawan" @click="adminTab = 'karyawan'" :class="adminTab === 'karyawan' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs transition">
                                        <i class="fa-solid fa-users-gear mr-1"></i> Data Karyawan
                                    </button>
                                </div>
                                <button @click="adminLogout()" class="px-3 py-2 bg-red-500/25 hover:bg-red-500/40 text-red-300 border border-red-500/30 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                                </button>
                            </div>
                        </div>

                        <!-- TAB 1: REKAP ABSENSI -->
                        <div x-show="adminTab === 'rekap' && canAccessRekap" class="glass-card p-6 rounded-3xl space-y-6">
                            <div class="flex flex-wrap justify-between items-center gap-4">
                                <div>
                                    <h2 class="text-xl font-bold text-white">Rekapitulasi Absensi</h2>
                                    <p class="text-xs text-slate-400">
                                        <span x-show="isAdminOnly" class="text-amber-400 italic">Mode Admin: Menampilkan seluruh rekap absensi karyawan (Read Only, tanpa tombol reset).</span>
                                        <span x-show="isOperationalRole" class="text-amber-400 italic">Menampilkan rekap absensi berdasarkan ID Anda yang sedang login (Read Only).</span>
                                        <span x-show="isMasterOrPM">Batas waktu absen normal 09.45 WIB (Regional PM, Supervisor, Installer) & 09.10 WIB (Admin & SND). Filter rentang waktu & export CSV.</span>
                                    </p>
                                </div>
                                <div class="flex flex-wrap items-center gap-3">
                                    <div>
                                        <label class="block text-[10px] text-slate-400 uppercase font-bold">Dari Tanggal</label>
                                        <input type="date" x-model="filterStartDate" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-slate-200">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-slate-400 uppercase font-bold">Sampai Tanggal</label>
                                        <input type="date" x-model="filterEndDate" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-slate-200">
                                    </div>
                                    <button @click="loadAttendanceData()" class="mt-4 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold rounded-xl transition" title="Muat Ulang Data">
                                        <i class="fa-solid fa-rotate-right"></i> Refresh
                                    </button>
                                    <!-- Reset Data button: Master Admin & Project Manager Only -->
                                    <button x-show="canResetRekap" @click="clearAllAttendance" class="mt-4 px-3 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs font-bold rounded-xl transition" title="Reset Data Absensi">
                                        <i class="fa-solid fa-trash-can mr-1"></i> Reset Data
                                    </button>
                                    <button @click="exportCSV" class="mt-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-emerald-600/30">
                                        <i class="fa-solid fa-file-csv mr-1"></i> Export CSV
                                    </button>
                                </div>
                            </div>

                            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                                            <th class="p-4">Tanggal & Waktu (Server)</th>
                                            <th class="p-4">ID</th>
                                            <th class="p-4">Nama</th>
                                            <th class="p-4">Role</th>
                                            <th class="p-4">Basecamp</th>
                                            <th class="p-4">Terlambat</th>
                                            <th class="p-4">Status GPS</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        <template x-for="item in filteredAttendance" :key="item.id">
                                            <tr class="hover:bg-slate-900/50 transition">
                                                <td class="p-4 font-semibold text-slate-300" x-text="item.timestamp"></td>
                                                <td class="p-4 font-mono text-amber-400" x-text="item.empId"></td>
                                                <td class="p-4 font-bold text-white" x-text="item.name"></td>
                                                <td class="p-4 text-slate-400" x-text="item.role"></td>
                                                <td class="p-4"><span class="px-2.5 py-1 bg-slate-800 rounded-lg text-amber-300 border border-slate-700 font-semibold" x-text="item.basecamp"></span></td>
                                                <td class="p-4">
                                                    <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold" 
                                                        :class="getLatenessMinutes(item.timestamp, item.role) > 0 ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'" 
                                                        x-text="formatLateness(item.timestamp, item.role)"></span>
                                                </td>
                                                <td class="p-4 text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Verified (<span x-text="item.accuracy"></span>m)</td>
                                            </tr>
                                        </template>
                                        <template x-if="filteredAttendance.length === 0">
                                            <tr>
                                                <td colspan="7" class="p-8 text-center text-slate-500 italic">Belum ada data absensi untuk akun/rentang tanggal ini.</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- TAB 2: PERSETUJUAN IZIN -->

    <script>
        const SUPABASE_URL = 'https://wtvwugzwjywnzughmcts.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0dnd1Z3p3anl3bnp1Z2htY3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzEyNjQsImV4cCI6MjEwMTUwNzI2NH0.iC2CNTEYKdVAtyvNSBAEw108SrKgNH__3zbOq0HP7jM';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getLocalDate(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function getOrCreateStableDeviceIdentifier() {
            let deviceId = localStorage.getItem('bc_device_uuid');
            if (deviceId) return deviceId;

            const fingerprintComponents = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset()
            ].join('|||');

            let hash = 0;
            for (let i = 0; i < fingerprintComponents.length; i++) {
                const char = fingerprintComponents.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }

            deviceId = 'FP-' + Math.abs(hash).toString(36).toUpperCase() + '-' + Math.abs(screen.width * screen.height).toString(36).toUpperCase();
            localStorage.setItem('bc_device_uuid', deviceId);
            return deviceId;
        }

        async function checkIsMockLocation(coords) {
            if (coords && coords.isMocked === true) return true;
            return false;
        }

        async function simulateServerSideValidation(payload) {
            const { loginId, loginPass, currentCoords, gpsAccuracy, simulationMode, deviceId } = payload;
            
            const lat = currentCoords ? currentCoords.lat : 0;
            const lng = currentCoords ? currentCoords.lng : 0;

            const { data, error } = await _supabase.rpc('validate_and_checkin', {
                p_login_id: loginId,
                p_login_pass: loginPass,
                p_lat: lat,
                p_lng: lng,
                p_accuracy: gpsAccuracy || 5,
                p_simulation_mode: simulationMode,
                p_device_id: deviceId
            });

            if (error) {
                return { success: false, message: 'Gagal menghubungi server database: ' + error.message };
            }

            return data;
        }

        function absensiApp() {
            return {
                isAdminView: false,
                isAdminLoggedIn: false,
                adminLoginUser: '',
                adminLoginPass: '',
                adminTab: 'rekap',
                simulationMode: false,
                isDesktopDevice: window.innerWidth >= 1024,
                
                currentUserRole: '',
                currentEmpId: null,
                isMasterAdmin: false,

                get timeGreeting() {
                    const hour = new Date().getHours();
                    if (hour >= 4 && hour < 11) return 'Selamat Pagi';
                    if (hour >= 11 && hour < 15) return 'Selamat Siang';
                    if (hour >= 15 && hour < 18) return 'Selamat Sore';
                    return 'Selamat Malam';
                },

                get currentUserName() {
                    if (this.isMasterAdmin) return 'Master Admin';
                    const emp = this.employees.find(e => e.id === this.currentEmpId);
                    return emp ? emp.name : 'User';
                },

                get normalizedRole() {
                    return (this.currentUserRole || '').trim().toLowerCase();
                },
                get isMasterOrPM() {
                    if (this.isMasterAdmin) return true;
                    const r = this.normalizedRole;
                    return r === 'project manager' || r === 'pusat' || r === 'superadmin' || r.includes('project manager');
                },
                get isAdminOnly() {
                    const r = this.normalizedRole;
                    return r === 'admin' || (r.includes('admin') && !this.isMasterOrPM);
                },
                get isOperationalRole() {
                    const r = this.normalizedRole;
                    const operationalRoles = ['regional pm', 'project supervisor', 'fiber installer', 'snd engineer'];
                    return operationalRoles.includes(r) || (!this.isMasterOrPM && !this.isAdminOnly && this.currentEmpId);
                },

                get canAccessRekap() {
                    return true;
                },
                get canAccessIzin() {
                    return true;
                },
                get canAccessMessages() {
                    return this.isMasterOrPM;
                },
                get canAccessBasecamp() {
                    return true;
                },
                get canAccessKaryawan() {
                    return this.isMasterOrPM;
                },

                get canModifyBasecamp() {
                    return this.isMasterOrPM;
                },
                get canModifyIzin() {
                    return this.isMasterOrPM;
                },
                get canResetRekap() {
                    return this.isMasterOrPM;
                },

                employeeTab: 'checkin',

                loginId: '',
                loginPass: '',
                gpsStatus: 'Mendeteksi GPS...',
                gpsAccuracy: null,
                currentCoords: null,
                detectedBasecamp: null,

                leaveForm: {
                    empId: '',
                    type: 'Sakit',
                    startDate: getLocalDate(),
                    endDate: getLocalDate(),
                    reason: ''
                },

                messageForm: {
                    recipientId: 'ALL',
                    message: ''
                },

                filterStartDate: (() => {
                    const d = new Date();
                    d.setDate(d.getDate() - 30);
                    return getLocalDate(d);
                })(),
                filterEndDate: getLocalDate(),

                map: null,
                marker: null,
                circle: null,

                showBasecampModal: false,
                editBasecampIndex: null,
                basecampForm: { name: 'HO Pekanbaru', lat: 0.50653, lng: 101.42304, radius: 500 },

                showEmployeeModal: false,
                editEmployeeIndex: null,
                employeeForm: { id: '', name: '', role: '', password: '', deviceId: null },

                basecamps: [],
                employees: [],
                attendanceLogs: [],
                leaves: [],
                messages: [],

                async init() {
                    this.initGPS();
                    await getOrCreateStableDeviceIdentifier();
                    await this.loadAttendanceData();
                    await this.loadMessagesData();
                },

                get employeeDeadlineText() {
                    if (!this.loginId) return '09.45 WIB / 09.10 WIB';
                    const emp = this.employees.find(e => e.id.toLowerCase() === this.loginId.trim().toLowerCase());
                    if (!emp) return '09.45 WIB';
                    const r = (emp.role || '').trim().toLowerCase();
                    if (r === 'admin' || r === 'snd engineer' || r.includes('snd')) {
                        return '09.10 WIB';
                    }
                    return '09.45 WIB';
                },

                getLatenessMinutes(timestamp, role = '') {
                    if (!timestamp) return 0;
                    let match = timestamp.match(/(\d{2}):(\d{2})(?::(\d{2}))?/);
                    let h = 0, m = 0;
                    if (match) {
                        h = parseInt(match[1], 10);
                        m = parseInt(match[2], 10);
                    } else {
                        let d = new Date(timestamp);
                        if (!isNaN(d.getTime())) {
                            h = d.getHours();
                            m = d.getMinutes();
                        } else {
                            return 0;
                        }
                    }
                    const totalMinutes = h * 60 + m;
                    
                    const r = (role || '').trim().toLowerCase();
                    let maxAllowedMinutes = 9 * 60 + 45;
                    
                    if (r === 'admin' || r === 'snd engineer' || r.includes('snd')) {
                        maxAllowedMinutes = 9 * 60 + 10;
                    } else if (r === 'regional pm' || r === 'project supervisor' || r === 'fiber installer') {
                        maxAllowedMinutes = 9 * 60 + 45;
                    }

                    return Math.max(0, totalMinutes - maxAllowedMinutes);
                },

                formatLateness(timestamp, role = '') {
                    const mins = this.getLatenessMinutes(timestamp, role);
                    if (mins === 0) {
                        return 'Tepat Waktu';
                    }
                    return `${mins} menit`;
                },

                async loadAttendanceData() {
                    let { data: attData } = await _supabase.from('attendance').select('*').order('id', { ascending: false });
                    if (attData) {
                        this.attendanceLogs = attData.map(item => ({
                            id: item.id,
                            empId: item.emp_id,
                            name: item.name,
                            role: item.role,
                            basecamp: item.basecamp,
                            timestamp: item.timestamp,
                            date: item.date || getLocalDate(),
                            accuracy: item.accuracy
                        }));
                    }

                    let { data: leaveData } = await _supabase.from('leaves').select('*').order('id', { ascending: false });
                    if (leaveData) {
                        this.leaves = leaveData.map(item => ({
                            id: item.id,
                            empId: item.emp_id,
                            name: item.name,
                            type: item.type,
                            startDate: item.start_date,
                            endDate: item.end_date,
                            reason: item.reason,
                            status: item.status,
                            timestamp: item.timestamp
                        }));
                    }

                    let { data: bcData } = await _supabase.from('basecamps').select('*');
                    if (bcData && bcData.length > 0) {
                        this.basecamps = bcData;
                    }

                    let { data: empData } = await _supabase.from('employees').select('*');
                    if (empData && empData.length > 0) {
                        this.employees = empData.map(e => ({
                            id: e.id,
                            name: e.name,
                            role: e.role,
                            password: e.password,
                            deviceId: e.device_id
                        }));
                    }
                },

                async loadMessagesData() {
                    let { data, error } = await _supabase.from('messages').select('*').order('id', { ascending: false });
                    if (data) {
                        this.messages = data.map(m => ({
                            id: m.id,
                            senderId: m.sender_id,
                            recipientId: m.recipient_id,
                            message: m.message,
                            timestamp: m.timestamp
                        }));
                    }
                },

                getEmployeeName(empId) {
                    const emp = this.employees.find(e => e.id === empId);
                    return emp ? emp.name : empId;
                },

                async sendMessage() {
                    const newMsg = {
                        sender_id: this.currentEmpId || 'PM',
                        recipient_id: this.messageForm.recipientId,
                        message: this.messageForm.message,
                        timestamp: new Date().toLocaleString('id-ID')
                    };

                    const { error } = await _supabase.from('messages').insert([newMsg]);
                    if (error) {
                        alert('Gagal mengirim pesan: ' + error.message);
                        return;
                    }

                    alert('Pesan berhasil dikirim!');
                    this.messageForm.message = '';
                    await this.loadMessagesData();
                },

                async deleteMessage(id) {
                    if (confirm('Hapus pesan ini?')) {
                        const { error } = await _supabase.from('messages').delete().eq('id', id);
                        if (!error) {
                            await this.loadMessagesData();
                        } else {
                            alert('Gagal menghapus pesan: ' + error.message);
                        }
                    }
                },

                async clearAllAttendance() {
                    if (!this.canResetRekap) {
                        alert('Akses Dibatasi: Anda tidak memiliki hak akses untuk mereset data absensi.');
                        return;
                    }
                    if (confirm('Apakah Anda yakin ingin menghapus seluruh data absensi?')) {
                        const { error } = await _supabase.from('attendance').delete().neq('id', 0);
                        if (!error) {
                            this.attendanceLogs = [];
                        } else {
                            alert('Gagal menghapus data: ' + error.message);
                        }
                    }
                },

                initGPS() {
                    if (navigator.geolocation) {
                        navigator.geolocation.watchPosition(
                            async (position) => {
                                const isMocked = position.coords.isMocked || await checkIsMockLocation(position.coords);
                                this.currentCoords = { 
                                    lat: position.coords.latitude, 
                                    lng: position.coords.longitude,
                                    isMocked: isMocked 
                                };
                                this.gpsAccuracy = Math.round(position.coords.accuracy);
                                this.gpsStatus = isMocked ? 'Peringatan: Mock GPS!' : 'GPS Aktif & Terhubung';
                                this.checkNearestBasecamp(this.currentCoords.lat, this.currentCoords.lng);
                            },
                            (error) => {
                                this.gpsStatus = 'Gagal mendeteksi GPS.';
                            },
                            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                        );
                    } else {
                        this.gpsStatus = 'Browser tidak mendukung GPS.';
                    }
                },

                calculateDistance(lat1, lon1, lat2, lon2) {
                    const R = 6371e3;
                    const φ1 = lat1 * Math.PI/180;
                    const φ2 = lat2 * Math.PI/180;
                    const Δφ = (lat2-lat1) * Math.PI/180;
                    const Δλ = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                              Math.cos(φ1) * Math.cos(φ2) *
                              Math.sin(Δλ/2) * Math.sin(Δλ/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    return R * c;
                },

                checkNearestBasecamp(lat, lng) {
                    let found = null;
                    for (let bc of this.basecamps) {
                        const dist = this.calculateDistance(lat, lng, bc.lat, bc.lng);
                        if (dist <= bc.radius) {
                            found = bc;
                            break;
                        }
                    }
                    this.detectedBasecamp = found;
                },

                get nearestDistanceText() {
                    if (!this.currentCoords) return 'Menghitung...';
                    let minDist = Infinity;
                    let nearestName = '';
                    let maxRadius = 500;
                    for (let bc of this.basecamps) {
                        const dist = this.calculateDistance(this.currentCoords.lat, this.currentCoords.lng, bc.lat, bc.lng);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestName = bc.name;
                            maxRadius = bc.radius;
                        }
                    }
                    return `${nearestName}: ${Math.round(minDist)} meter (Max ${maxRadius}m)`;
                },

                switchRole() {
                    this.isAdminView = !this.isAdminView;
                    if (this.isAdminView) {
                        this.loadAttendanceData();
                        this.loadMessagesData();
                    } else {
                        this.isAdminLoggedIn = false;
                        this.currentUserRole = '';
                        this.currentEmpId = null;
                        this.isMasterAdmin = false;
                    }
                },

                handleAdminLogin() {
                    if (this.adminLoginUser === 'admin' && this.adminLoginPass === 'Ounyenk2018#') {
                        this.isAdminLoggedIn = true;
                        this.isMasterAdmin = true;
                        this.currentUserRole = 'Master Admin';
                        this.currentEmpId = null;
                        this.adminLoginUser = '';
                        this.adminLoginPass = '';
                        this.adminTab = 'rekap';
                        this.loadAttendanceData();
                        this.loadMessagesData();
                    } else {
                        const emp = this.employees.find(e => e.id === this.adminLoginUser && e.password === this.adminLoginPass);
                        if (emp) {
                            this.isAdminLoggedIn = true;
                            this.isMasterAdmin = false;
                            this.currentUserRole = emp.role || 'Admin';
                            this.currentEmpId = emp.id;
                            this.adminLoginUser = '';
                            this.adminLoginPass = '';
                            
                            if (this.canAccessRekap) {
                                this.adminTab = 'rekap';
                            } else if (this.canAccessIzin) {
                                this.adminTab = 'izin';
                            } else {
                                this.adminTab = 'basecamp';
                            }

                            this.loadAttendanceData();
                            this.loadMessagesData();
                        } else {
                            alert('ID/Username atau Password salah!');
                        }
                    }
                },

                adminLogout() {
                    this.isAdminLoggedIn = false;
                    this.currentUserRole = '';
                    this.currentEmpId = null;
                    this.isMasterAdmin = false;
                },

                async handleCheckIn() {
                    if (!this.loginId || !this.loginPass) {
                        alert('Masukkan ID Karyawan dan Password!');
                        return;
                    }

                    const currentDeviceId = await getOrCreateStableDeviceIdentifier();
                    const payload = {
                        loginId: this.loginId,
                        loginPass: this.loginPass,
                        currentCoords: this.currentCoords,
                        gpsAccuracy: this.gpsAccuracy,
                        simulationMode: this.simulationMode,
                        deviceId: currentDeviceId
                    };

                    this.gpsStatus = 'Memproses Validasi Server...';
                    const result = await simulateServerSideValidation(payload);

                    if (!result.success) {
                        alert(result.message);
                        this.gpsStatus = 'GPS Aktif & Terhubung';
                        return;
                    }

                    let pmMessageText = "";
                    let { data: msgData } = await _supabase.from('messages').select('*').order('id', { ascending: false });
                    if (msgData && msgData.length > 0) {
                        const targetMsg = msgData.find(m => m.recipient_id === 'ALL' || m.recipient_id === this.loginId);
                        if (targetMsg) {
                            pmMessageText = `\n\n📢 PESAN DARI PROJECT MANAGER:\n"${targetMsg.message}"`;
                        }
                    }

                    alert(result.message + pmMessageText);
                    this.loginId = '';
                    this.loginPass = '';
                    await this.loadAttendanceData();
                },

                async submitLeaveRequest() {
                    const emp = this.employees.find(e => e.id === this.leaveForm.empId);
                    if (!emp) {
                        alert('ID Karyawan tidak ditemukan!');
                        return;
                    }

                    const newLeave = {
                        emp_id: emp.id,
                        name: emp.name,
                        type: this.leaveForm.type,
                        start_date: this.leaveForm.startDate,
                        end_date: this.leaveForm.endDate,
                        reason: this.leaveForm.reason,
                        status: 'Pending',
                        timestamp: new Date().toLocaleString('id-ID')
                    };

                    const { error } = await _supabase.from('leaves').insert([newLeave]);
                    if (error) {
                        alert('Gagal mengirim pengajuan: ' + error.message);
                        return;
                    }

                    alert('Pengajuan berhasil dikirim.');
                    this.leaveForm.reason = '';
                    await this.loadAttendanceData();
                },

                async updateLeaveStatus(id, status) {
                    if (!this.canModifyIzin) {
                        alert('Akses Dibatasi: Anda memiliki hak akses Read Only pada Persetujuan Izin.');
                        return;
                    }
                    
                    const leaveIndex = this.leaves.findIndex(l => l.id == id);
                    if (leaveIndex === -1) {
                        alert('Data tidak ditemukan!');
                        return;
                    }

                    let previousStatus = this.leaves[leaveIndex].status;
                    
                    // Optimistic UI Update
                    this.leaves[leaveIndex].status = status;
                    this.leaves = [...this.leaves]; 
                    
                    try {
                        const { data, error } = await _supabase
                            .from('leaves')
                            .update({ status: status })
                            .eq('id', id)
                            .select();
                        
                        if (error) {
                            throw error;
                        }

                        if (!data || data.length === 0) {
                            throw new Error("Update ditolak oleh server (RLS aktif atau ID tidak ditemukan). Nonaktifkan RLS pada tabel leaves di Supabase.");
                        }
                        
                        alert(`Pengajuan berhasil ${status}!`);
                        
                    } catch (err) {
                        // Rollback jika terjadi kegagalan server
                        if (leaveIndex !== -1) {
                            this.leaves[leaveIndex].status = previousStatus;
                            this.leaves = [...this.leaves];
                        }
                        alert('Terjadi kesalahan pada sistem: ' + err.message);
                    }
                },

                get employeeLeaves() {
                    if (!this.leaveForm.empId) return [];
                    return this.leaves.filter(l => l.empId === this.leaveForm.empId);
                },

                get displayedLeaves() {
                    let items = this.leaves;
                    if (this.isOperationalRole && !this.isMasterOrPM && !this.isAdminOnly) {
                        items = items.filter(l => l.empId === this.currentEmpId);
                    }
                    return items;
                },

                initMap() {
                    const lat = parseFloat(this.basecampForm.lat) || 0.50653;
                    const lng = parseFloat(this.basecampForm.lng) || 101.42304;
                    const radius = parseInt(this.basecampForm.radius) || 500;

                    if (!this.map) {
                        this.map = L.map('basecampMap').setView([lat, lng], 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(this.map);
                        this.marker = L.marker([lat, lng], { draggable: this.canModifyBasecamp }).addTo(this.map);
                        this.circle = L.circle([lat, lng], { radius: radius, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.2 }).addTo(this.map);

                        if (this.canModifyBasecamp) {
                            this.marker.on('dragend', (e) => {
                                const pos = e.target.getLatLng();
                                this.basecampForm.lat = parseFloat(pos.lat.toFixed(6));
                                this.basecampForm.lng = parseFloat(pos.lng.toFixed(6));
                                this.updateMapVisuals();
                            });
                        }
                    } else {
                        this.map.invalidateSize();
                        this.map.setView([lat, lng], 15);
                        this.marker.setLatLng([lat, lng]);
                        this.circle.setLatLng([lat, lng]);
                        this.circle.setRadius(radius);
                    }
                },

                updateMapVisuals() {
                    const lat = parseFloat(this.basecampForm.lat);
                    const lng = parseFloat(this.basecampForm.lng);
                    const radius = parseInt(this.basecampForm.radius) || 500;
                    if (!isNaN(lat) && !isNaN(lng)) {
                        this.circle.setLatLng([lat, lng]);
                        this.circle.setRadius(radius);
                    }
                },

                updateMapFromInputs() {
                    if (!this.canModifyBasecamp) return;
                    const lat = parseFloat(this.basecampForm.lat);
                    const lng = parseFloat(this.basecampForm.lng);
                    const radius = parseInt(this.basecampForm.radius) || 500;
                    if (!isNaN(lat) && !isNaN(lng) && this.map) {
                        this.marker.setLatLng([lat, lng]);
                        this.circle.setLatLng([lat, lng]);
                        this.circle.setRadius(radius);
                        this.map.setView([lat, lng], this.map.getZoom());
                    }
                },

                openBasecampModal() {
                    if (!this.canModifyBasecamp) return;
                    this.editBasecampIndex = null;
                    this.basecampForm = { name: 'HO Pekanbaru', lat: 0.50653, lng: 101.42304, radius: 500 };
                    this.showBasecampModal = true;
                    this.$nextTick(() => { this.initMap(); });
                },
                editBasecamp(index) {
                    this.editBasecampIndex = index;
                    this.basecampForm = { ...this.basecamps[index] };
                    this.showBasecampModal = true;
                    this.$nextTick(() => { this.initMap(); });
                },
                async saveBasecamp() {
                    if (!this.canModifyBasecamp) {
                        alert('Akses Dibatasi: Anda memiliki hak akses Read Only untuk Basecamp.');
                        this.showBasecampModal = false;
                        return;
                    }
                    if (this.editBasecampIndex !== null) {
                        const targetId = this.basecamps[this.editBasecampIndex].id;
                        const { error } = await _supabase.from('basecamps').update({
                            name: this.basecampForm.name,
                            lat: parseFloat(this.basecampForm.lat),
                            lng: parseFloat(this.basecampForm.lng),
                            radius: parseInt(this.basecampForm.radius)
                        }).eq('id', targetId);
                        if (error) {
                            alert('Gagal mengupdate basecamp: ' + error.message);
                            return;
                        }
                    } else {
                        const newBc = {
                            name: this.basecampForm.name,
                            lat: parseFloat(this.basecampForm.lat),
                            lng: parseFloat(this.basecampForm.lng),
                            radius: parseInt(this.basecampForm.radius)
                        };
                        const { error } = await _supabase.from('basecamps').insert([newBc]);
                        if (error) {
                            alert('Gagal menambah basecamp: ' + error.message);
                            return;
                        }
                    }
                    this.showBasecampModal = false;
                    await this.loadAttendanceData();
                },
                async deleteBasecamp(index) {
                    if (!this.canModifyBasecamp) {
                        alert('Akses Dibatasi: Anda tidak memiliki hak akses untuk menghapus basecamp.');
                        return;
                    }
                    if (confirm('Hapus basecamp ini?')) {
                        const targetId = this.basecamps[index].id;
                        const { error } = await _supabase.from('basecamps').delete().eq('id', targetId);
                        if (!error) {
                            await this.loadAttendanceData();
                        } else {
                            alert('Gagal menghapus basecamp: ' + error.message);
                        }
                    }
                },

                openEmployeeModal() {
                    this.editEmployeeIndex = null;
                    this.employeeForm = { id: '', name: '', role: '', password: '', deviceId: null };
                    this.showEmployeeModal = true;
                },
                editEmployee(index) {
                    this.editEmployeeIndex = index;
                    this.employeeForm = { ...this.employees[index] };
                    this.showEmployeeModal = true;
                },
                async saveEmployee() {
                    if (this.editEmployeeIndex !== null) {
                        const targetEmpId = this.employees[this.editEmployeeIndex].id;
                        const { error } = await _supabase.from('employees').update({
                            name: this.employeeForm.name,
                            role: this.employeeForm.role,
                            password: this.employeeForm.password
                        }).eq('id', targetEmpId);
                        if (error) {
                            alert('Gagal mengupdate karyawan: ' + error.message);
                            return;
                        }
                    } else {
                        const newEmp = {
                            id: this.employeeForm.id,
                            name: this.employeeForm.name,
                            role: this.employeeForm.role,
                            password: this.employeeForm.password,
                            device_id: null
                        };
                        const { error } = await _supabase.from('employees').insert([newEmp]);
                        if (error) {
                            alert('Gagal menambah karyawan: ' + error.message);
                            return;
                        }
                    }
                    this.showEmployeeModal = false;
                    await this.loadAttendanceData();
                },
                async deleteEmployee(index) {
                    if (confirm('Hapus karyawan ini?')) {
                        const targetId = this.employees[index].id;
                        const { error } = await _supabase.from('employees').delete().eq('id', targetId);
                        if (!error) {
                            await this.loadAttendanceData();
                        } else {
                            alert('Gagal menghapus karyawan: ' + error.message);
                        }
                    }
                },
                async resetDevice(index) {
                    if (confirm('Reset perangkat terikat?')) {
                        const targetId = this.employees[index].id;
                        const { error } = await _supabase.from('employees').update({ device_id: null }).eq('id', targetId);
                        if (!error) {
                            await this.loadAttendanceData();
                            alert('Device berhasil direset.');
                        } else {
                            alert('Gagal mereset device: ' + error.message);
                        }
                    }
                },

                get filteredAttendance() {
                    let logs = this.attendanceLogs;
                    if (this.isOperationalRole && !this.isMasterOrPM && !this.isAdminOnly) {
                        logs = logs.filter(item => item.empId === this.currentEmpId);
                    }
                    return logs.filter(item => {
                        const itemDate = item.date || getLocalDate();
                        if (this.filterStartDate && this.filterEndDate) {
                            return itemDate >= this.filterStartDate && itemDate <= this.filterEndDate;
                        }
                        return true;
                    });
                },

                exportCSV() {
                    let csvContent = "data:text/csv;charset=utf-8,ID,Nama,Role,Basecamp,Tanggal Waktu,Terlambat,Akurasi GPS\n";
                    this.filteredAttendance.forEach(row => {
                        let latenessText = this.formatLateness(row.timestamp, row.role);
                        csvContent += `"${row.empId}","${row.name}","${row.role}","${row.basecamp}","${row.timestamp}","${latenessText}","${row.accuracy}m"\r\n`;
                    });
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `rekap_absensi_${this.filterStartDate}_sampai_${this.filterEndDate}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
    </script>
</body>
</html>
