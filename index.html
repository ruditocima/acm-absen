<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Enterprise - Luxury Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        gold: { 500: '#d4af37', 600: '#aa8c2c', 400: '#e6ca65' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); }
    </style>
</head>
<body class="h-full text-slate-100 font-sans flex flex-col">

    <!-- Header tetap sama -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center z-50 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center text-slate-950 font-bold shadow-md">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-wide uppercase text-gold-400">Panel Simulasi Absensi</h1>
                <p class="text-xs text-slate-400">Mode Produksi Aman (Server-Sync)</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
            <button onclick="switchMode('mobile')" id="btn-mobile" class="px-4 py-2 text-xs font-semibold rounded-lg bg-gold-500 text-slate-950 transition-all shadow-md flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen"></i> Tampilan HP
            </button>
            <button onclick="switchMode('desktop')" id="btn-desktop" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-desktop"></i> Tampilan Desktop
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden relative flex justify-center items-center bg-slate-950">
        <!-- (Konten HTML di bawah ini tetap sama seperti file asli Anda) -->
        <div id="view-mobile" class="w-full h-full max-w-md bg-slate-900 flex flex-col shadow-2xl relative overflow-hidden sm:border-x sm:border-slate-800 sm:max-h-[850px] sm:rounded-3xl">
            <div class="p-5 bg-gradient-to-b from-slate-800 to-slate-900 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-gold-400 font-bold bg-gold-500/10 px-2 py-0.5 rounded-full border border-gold-500/20">Basecamp: Pekanbaru Pusat</span>
                    <h2 class="text-lg font-bold text-white mt-1">Halo, Rudi Batubara</h2>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-5 space-y-5 pb-24">
                <div id="m-tab-absen" class="space-y-5">
                    <div class="glass-card p-6 rounded-3xl text-center relative overflow-hidden shadow-xl">
                        <h3 id="live-clock" class="text-4xl font-black text-white my-2 tracking-wider">00:00:00</h3>
                        <p class="text-xs text-gold-400 font-medium"><i class="fa-solid fa-location-dot"></i> Menunggu lokasi...</p>
                        <button onclick="handleAbsen()" class="w-full mt-6 py-4 rounded-2xl gold-gradient text-slate-950 font-bold text-sm shadow-lg hover:opacity-95 transition active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-fingerprint text-lg"></i> ABSEN MASUK SEKARANG
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- (Bagian Desktop diabaikan demi efisiensi, silakan copy bagian desktop dari file asli Anda ke sini jika perlu) -->
    </main>

    <script>
        // === 1. SYNC WAKTU DARI SERVER ===
        // Ganti URL ini dengan endpoint API backend Anda (misal: https://api.perusahaan.com/time)
        async function getServerTime() {
            try {
                // Simulasi fetching waktu dari server
                // const response = await fetch('/api/get-server-time');
                // const data = await response.json();
                // return new Date(data.serverTime);
                
                return new Date(); // Fallback sementara
            } catch (error) {
                console.error("Gagal sinkronisasi waktu server");
                return new Date();
            }
        }

        // === 2. FUNGSI ABSEN DENGAN VALIDASI ===
        async function handleAbsen() {
            const btn = document.querySelector('button[onclick="handleAbsen()"]');
            const originalHtml = btn.innerHTML;
            
            if (!navigator.geolocation) {
                alert('Browser tidak mendukung lokasi.');
                return;
            }

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-lg"></i> MEMVERIFIKASI KEAMANAN...`;
            btn.disabled = true;

            // Dapatkan waktu server SEBELUM proses koordinat selesai
            const serverTime = await getServerTime();

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude, accuracy } = position.coords;

                    // === KEAMANAN: VALIDASI AKURASI ===
                    // Jika akurasi > 20 meter, dianggap tidak valid (potensi Fake GPS/Indoor)
                    if (accuracy > 20) {
                        alert(`Akurasi GPS terlalu rendah (${Math.round(accuracy)}m). Harap keluar ruangan atau matikan aplikasi Fake GPS.`);
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                        return;
                    }

                    // === KEAMANAN: JARAK ===
                    const distance = calculateDistance(latitude, longitude, 0.5071, 101.4478);
                    const maxRadius = 15000; 

                    if (distance > maxRadius) {
                        alert("Lokasi tidak terdeteksi di dalam radius kantor.");
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                        return;
                    }

                    // === JIKA LOLOS: KIRIM KE BACKEND ===
                    // Di sini Anda mengirim data ke database
                    console.log("Data Aman:", { latitude, longitude, serverTime, accuracy });
                    
                    alert(`Absensi Berhasil tercatat pada: ${serverTime.toLocaleTimeString()}`);
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                },
                (error) => {
                    alert('Gagal mendapatkan lokasi. Pastikan izin GPS aktif.');
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // === FUNGSI BANTUAN ===
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Live clock generator (Tetap untuk tampilan)
        setInterval(() => {
            const clockEl = document.getElementById('live-clock');
            if(clockEl) clockEl.innerText = new Date().toTimeString().split(' ')[0];
        }, 1000);
    </script>
</body>
</html>
