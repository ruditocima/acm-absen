<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Enterprise - Luxury Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        gold: { 500: '#d4af37', 600: '#aa8c2c', 400: '#e6ca65' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); }
    </style>
</head>
<body class="h-full text-slate-100 font-sans flex flex-col">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- SIMULATION CONTROL BAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center z-40 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center text-slate-950 font-bold shadow-md">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-wide uppercase text-gold-400">Panel Simulasi Absensi</h1>
                <p class="text-xs text-slate-400">Pilih mode tampilan perangkat untuk menguji sistem</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
            <button onclick="switchMode('mobile')" id="btn-mobile" class="px-4 py-2 text-xs font-semibold rounded-lg bg-gold-500 text-slate-950 transition-all shadow-md flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen"></i> Tampilan HP (Karyawan)
            </button>
            <button onclick="switchMode('desktop')" id="btn-desktop" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-desktop"></i> Tampilan Desktop (Master Admin)
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 overflow-hidden relative flex justify-center items-center bg-slate-950">

        <!-- ==================== MOBILE VIEW ==================== -->
        <div id="view-mobile" class="w-full h-full max-w-md bg-slate-900 flex flex-col shadow-2xl relative overflow-hidden sm:border-x sm:border-slate-800 sm:max-h-[850px] sm:rounded-3xl">
            <!-- Mobile Header (Simplified) -->
            <div class="p-5 bg-gradient-to-b from-slate-800 to-slate-900 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-white">Halo, Rudi Batubara</h2>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-5 pb-24">
                <div id="m-tab-absen" class="space-y-5">
                    <div class="glass-card p-6 rounded-3xl text-center shadow-xl">
                        <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Waktu Server WIB</p>
                        <h3 id="live-clock" class="text-4xl font-black text-white my-2 tracking-wider">08:00:24</h3>
                        <button onclick="handleAbsen()" class="w-full mt-6 py-4 rounded-2xl gold-gradient text-slate-950 font-bold text-sm shadow-lg flex items-center justify-center gap-2">
                            ABSEN MASUK SEKARANG
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="absolute bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-lg border-t border-slate-800 px-6 py-3 flex justify-around items-center z-20">
                <button id="m-nav-absen" class="text-gold-400 flex flex-col items-center text-xs space-y-1"><i class="fa-solid fa-house"></i><span>Absen</span></button>
            </div>
        </div>


        <!-- ==================== DESKTOP VIEW ==================== -->
        <div id="view-desktop" class="w-full h-full bg-slate-950 hidden flex overflow-hidden">
            <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
                <div class="p-5 font-bold text-white">Master Control</div>
                <nav class="flex-1 p-4 space-y-1 text-xs">
                    <button onclick="switchDesktopTab('karyawan')" id="d-nav-karyawan" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-gold-500/10 text-gold-400 border border-gold-500/20">
                        <i class="fa-solid fa-users w-5"></i> Data Karyawan
                    </button>
                </nav>
            </aside>

            <div class="flex-1 flex flex-col overflow-hidden bg-slate-950">
                <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center">
                    <h3 id="desktop-title" class="text-sm font-bold text-white">Manajemen Data Karyawan</h3>
                </header>

                <div class="flex-1 overflow-y-auto p-6">
                    <div id="d-tab-karyawan" class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-400 uppercase">Data Karyawan</h4>
                            <button onclick="openAddEmployeeModal()" class="px-3 py-1.5 gold-gradient text-slate-950 font-bold text-xs rounded-lg shadow"><i class="fa-solid fa-user-plus"></i> Tambah Karyawan</button>
                        </div>
                        <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-900 text-slate-400 uppercase border-b border-slate-800">
                                    <tr>
                                        <th class="p-3">ID</th>
                                        <th class="p-3">Nama</th>
                                        <th class="p-3">Atasan</th>
                                        <th class="p-3">Role</th>
                                        <th class="p-3">Device ID</th>
                                        <th class="p-3">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="karyawan-tbody" class="divide-y divide-slate-800 text-slate-300">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div id="employee-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-6 rounded-3xl border border-slate-800 space-y-4 shadow-2xl">
            <h3 id="modal-title" class="text-sm font-bold text-white uppercase border-b border-slate-800 pb-2">Tambah Karyawan</h3>
            <input type="hidden" id="edit-index" value="-1">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Nama Karyawan</label>
                <input type="text" id="inp-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Atasan (Supervisor)</label>
                <select id="inp-supervisor" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                    <option value="-">- Tidak Ada -</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Role</label>
                <input type="text" id="inp-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveEmployee()" class="flex-1 py-2.5 rounded-xl gold-gradient text-slate-950 font-bold text-xs">Simpan</button>
                <button onclick="closeEmployeeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs">Batal</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-6 rounded-3xl border border-slate-800 space-y-4 text-center">
            <h3 id="confirm-title" class="text-sm font-bold text-white">Konfirmasi</h3>
            <p id="confirm-message" class="text-xs text-slate-300"></p>
            <div class="flex gap-2">
                <button id="confirm-btn-yes" class="flex-1 py-2.5 rounded-xl bg-rose-500 text-white font-bold text-xs">Ya</button>
                <button onclick="document.getElementById('confirm-modal').classList.add('hidden')" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // Data
        let employees = [
            { id: 'USR-001', name: 'Rudi Batubara', supervisor: '-', role: 'Admin', deviceId: 'DEV-9982' },
            { id: 'USR-002', name: 'Budi Santoso', supervisor: 'Rudi Batubara', role: 'Staff', deviceId: 'DEV-1122' }
        ];

        // Toast System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `glass-card px-4 py-3 rounded-2xl border ${type === 'success' ? 'border-emerald-500/30' : 'border-rose-500/30'} flex items-center gap-3 text-white max-w-sm`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check text-emerald-400' : 'fa-xmark text-rose-400'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Dropdown Logic
        function updateSupervisorDropdown(currentName = "") {
            const select = document.getElementById('inp-supervisor');
            select.innerHTML = '<option value="-">- Tidak Ada -</option>';
            employees.forEach(emp => {
                if(emp.name !== currentName) { // Prevent self-assignment
                    const opt = document.createElement('option');
                    opt.value = emp.name;
                    opt.textContent = emp.name;
                    select.appendChild(opt);
                }
            });
        }

        function renderEmployees() {
            const tbody = document.getElementById('karyawan-tbody');
            tbody.innerHTML = '';
            employees.forEach((emp, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-slate-400">${emp.id}</td>
                    <td class="p-3 font-medium text-white">${emp.name}</td>
                    <td class="p-3 text-gold-400 italic">${emp.supervisor}</td>
                    <td class="p-3 text-slate-300">${emp.role}</td>
                    <td class="p-3 text-emerald-400">${emp.deviceId}</td>
                    <td class="p-3 space-x-2">
                        <button onclick="openEditEmployeeModal(${index})" class="text-gold-400">Edit</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openAddEmployeeModal() {
            document.getElementById('modal-title').innerText = 'Tambah Karyawan';
            document.getElementById('edit-index').value = '-1';
            updateSupervisorDropdown(); // Populate with all
            document.getElementById('employee-modal').classList.remove('hidden');
        }

        function openEditEmployeeModal(index) {
            const emp = employees[index];
            document.getElementById('modal-title').innerText = 'Edit Karyawan';
            document.getElementById('edit-index').value = index;
            document.getElementById('inp-name').value = emp.name;
            document.getElementById('inp-role').value = emp.role;
            
            updateSupervisorDropdown(emp.name); // Populate, exclude self
            document.getElementById('inp-supervisor').value = emp.supervisor;
            
            document.getElementById('employee-modal').classList.remove('hidden');
        }

        function saveEmployee() {
            const index = parseInt(document.getElementById('edit-index').value);
            const name = document.getElementById('inp-name').value;
            const role = document.getElementById('inp-role').value;
            const supervisor = document.getElementById('inp-supervisor').value;

            if (index === -1) {
                employees.push({ id: 'USR-00'+(employees.length+1), name, supervisor, role, deviceId: 'NEW-DEV' });
            } else {
                employees[index].name = name;
                employees[index].role = role;
                employees[index].supervisor = supervisor;
            }
            
            document.getElementById('employee-modal').classList.add('hidden');
            renderEmployees();
            showToast('Data berhasil disimpan');
        }

        function closeEmployeeModal() { document.getElementById('employee-modal').classList.add('hidden'); }
        
        window.onload = renderEmployees;
    </script>
</body>
</html>
